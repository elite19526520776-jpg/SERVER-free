# ============================================================================
#  Realistic Shaders
# ============================================================================

# 游戏内设置界面的分页。In-game option screens.
screen = [LIGHTING] [ATMOSPHERE] [WATER] [MATERIAL] [POSTFX] <empty> [PERFORMANCE]

screen.LIGHTING = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS \
                  SHADOW_DISTORTION SHADOW_BIAS sunPathRotation <empty> \
                  SSAO SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH

screen.ATMOSPHERE = SKY_BRIGHTNESS SUN_INTENSITY MOON_INTENSITY <empty> \
                    FOG FOG_DENSITY <empty> \
                    WAVING_PLANTS WAVING_STRENGTH

screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT WATER_REFLECTION WATER_ABSORPTION

screen.MATERIAL = LABPBR NORMAL_STRENGTH SPECULAR_STRENGTH EMISSIVE_STRENGTH

screen.POSTFX = TONEMAP_ACES EXPOSURE CONTRAST SATURATION <empty> \
                BLOOM BLOOM_STRENGTH BLOOM_RADIUS <empty> \
                VIGNETTE SHARPEN DITHERING

screen.PERFORMANCE = shadowMapResolution shadowDistance SHADOW_SAMPLES \
                     SSAO SSAO_SAMPLES BLOOM

sliders = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS \
          SHADOW_DISTORTION SHADOW_BIAS sunPathRotation \
          SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH \
          SKY_BRIGHTNESS SUN_INTENSITY MOON_INTENSITY FOG_DENSITY \
          WAVING_STRENGTH WATER_WAVE_HEIGHT WATER_REFLECTION WATER_ABSORPTION \
          NORMAL_STRENGTH SPECULAR_STRENGTH EMISSIVE_STRENGTH \
          EXPOSURE CONTRAST SATURATION BLOOM_STRENGTH BLOOM_RADIUS VIGNETTE SHARPEN

# 半透明几何体用标准 alpha 混合。Standard alpha blending for translucents.
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA

# 延迟光照自己算方向光，关掉原版的手电筒式亮度补偿。
# We do our own directional lighting, so vanilla's flashlight compensation goes away.
oldLighting = false
oldHandLight = false

# 关掉泛光时整条 composite 链都不用跑。Skip the whole bloom chain when bloom is off.
program.composite.enabled = BLOOM
program.composite1.enabled = BLOOM
program.composite2.enabled = BLOOM

# 水下的雾由 deferred 自己算，原版那层蓝色蒙版会打架。
# Our deferred pass does underwater fog; vanilla's blue overlay fights with it.
underwaterOverlay = false
