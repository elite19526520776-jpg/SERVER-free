<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>方块世界 · VoxelCraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%236b8f3a'/%3E%3Crect y='12' width='32' height='20' fill='%23866043'/%3E%3C/svg%3E">
<style>
:root {
  --slot: 52px;
  --panel-bg: rgba(24, 24, 28, 0.94);
  --slot-bg: rgba(139, 139, 139, 0.32);
  --slot-border: rgba(255, 255, 255, 0.14);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0b0e14;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: default;
}
body.locked #game { cursor: none; }

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
#ui > * { pointer-events: auto; }

/* ── 准星 ── */
.crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  pointer-events: none;
  mix-blend-mode: difference;
}
.crosshair::before, .crosshair::after {
  content: "";
  position: absolute;
  background: #fff;
}
.crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
.crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }

.screen-fx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: background 0.12s linear;
}

/* ── HUD ── */
.hud {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.stats {
  position: absolute;
  bottom: calc(var(--slot) + 16px);
  display: flex;
  flex-direction: column-reverse;
  gap: 3px;
}
.stats-left { left: 50%; margin-left: calc(var(--slot) * -4.5); }
.stats-right { left: 50%; margin-left: calc(var(--slot) * 0.5); align-items: flex-end; }
.stats .row { display: flex; gap: 1px; }
.stats-right .row { flex-direction: row-reverse; }
.icon {
  width: 18px;
  height: 18px;
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0.28;
  filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.7));
}
.icon.full, .icon.half { opacity: 1; }
.icon.heart {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14s-6-3.8-6-8a3.5 3.5 0 0 1 6-2.3A3.5 3.5 0 0 1 14 6c0 4.2-6 8-6 8z' fill='%23111'/></svg>");
}
.icon.heart.full, .icon.heart.half {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14s-6-3.8-6-8a3.5 3.5 0 0 1 6-2.3A3.5 3.5 0 0 1 14 6c0 4.2-6 8-6 8z' fill='%23e33'/></svg>");
}
.icon.heart.half { clip-path: inset(0 50% 0 0); }
.icon.food {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5.5 2.2C8 1 11 2 11.6 4.6c.4 1.8-.5 3.4-2 4.3l-3.2 4.6a1.4 1.4 0 0 1-2.4-1.4l3-4.7C4 6.6 3.4 4.9 4 3.7c.3-.6.8-1.1 1.5-1.5z' fill='%23222'/><circle cx='3.2' cy='13' r='2' fill='%23222'/></svg>");
}
.icon.food.full, .icon.food.half {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5.5 2.2C8 1 11 2 11.6 4.6c.4 1.8-.5 3.4-2 4.3l-3.2 4.6a1.4 1.4 0 0 1-2.4-1.4l3-4.7C4 6.6 3.4 4.9 4 3.7c.3-.6.8-1.1 1.5-1.5z' fill='%23c9873a'/><circle cx='3.2' cy='13' r='2' fill='%23f0e6d2'/></svg>");
}
.icon.food.half { clip-path: inset(0 50% 0 0); }
.icon.armor {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1 2 3v5c0 4 4 6.5 6 7 2-.5 6-3 6-7V3z' fill='%23111'/></svg>");
}
.icon.armor.full, .icon.armor.half {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1 2 3v5c0 4 4 6.5 6 7 2-.5 6-3 6-7V3z' fill='%23c9d3e0'/></svg>");
}
.icon.bubble {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%236cf'/><circle cx='6' cy='6' r='1.6' fill='%23fff'/></svg>");
  opacity: 0.15;
}
.icon.bubble.full { opacity: 1; }
.row.shake { animation: shake 0.3s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

/* ── 快捷栏 ── */
.hotbar {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: rgba(0, 0, 0, 0.42);
  border: 2px solid rgba(255, 255, 255, 0.16);
  border-radius: 4px;
  pointer-events: auto;
}
.slot {
  position: relative;
  width: var(--slot);
  height: var(--slot);
  background: var(--slot-bg);
  border: 2px solid var(--slot-border);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.slot:hover { background: rgba(255, 255, 255, 0.24); }
.slot canvas {
  width: calc(var(--slot) - 10px);
  height: calc(var(--slot) - 10px);
  image-rendering: auto;
  pointer-events: none;
  filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.45));
}
.slot .count {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.85);
  pointer-events: none;
}
.slot .durability {
  position: absolute;
  left: 4px;
  bottom: 4px;
  height: 3px;
  display: none;
  border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
}
.hotbar .slot.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5), inset 0 0 12px rgba(255,255,255,0.25);
  transform: scale(1.06);
}

.item-name {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--slot) + 44px);
  font-size: 17px;
  font-weight: 600;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.toast {
  position: absolute;
  left: 50%;
  top: 16%;
  transform: translateX(-50%);
  max-width: 70vw;
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.62);
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.7;
  text-align: center;
  opacity: 0;
  transition: opacity 0.35s;
  pointer-events: none;
}

.debug {
  position: absolute;
  left: 10px;
  top: 10px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.55;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.85);
  background: rgba(0, 0, 0, 0.32);
  padding: 8px 12px;
  border-radius: 6px;
  pointer-events: none;
}
.hidden { display: none !important; }

/* ── 弹出界面 ── */
.modal {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
}
.panel {
  background: var(--panel-bg);
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  padding: 16px 20px 20px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  max-height: 92vh;
  overflow-y: auto;
}
.panel-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: 2px;
}
.panel-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
}
.armor-col { display: flex; flex-direction: column; gap: 3px; }
.player-preview {
  width: 74px;
  height: calc(var(--slot) * 4 + 9px);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 2px solid var(--slot-border);
  border-radius: 4px;
}
.craft-box { display: flex; align-items: center; gap: 12px; }
.craft-grid { display: grid; gap: 3px; }
.craft-2 { grid-template-columns: repeat(2, var(--slot)); }
.craft-3 { grid-template-columns: repeat(3, var(--slot)); }
.arrow, .furnace-arrow {
  width: 44px;
  height: 12px;
  background: rgba(255, 255, 255, 0.18);
  position: relative;
  border-radius: 2px;
}
.arrow::after, .furnace-arrow::after {
  content: "";
  position: absolute;
  right: -12px;
  top: -6px;
  border: 12px solid transparent;
  border-left-color: rgba(255, 255, 255, 0.18);
}
.arrow-fill {
  position: absolute;
  inset: 0;
  width: 0;
  background: #7ec850;
  border-radius: 2px;
  transition: width 0.1s linear;
}
.result-slot .slot {
  width: calc(var(--slot) * 1.2);
  height: calc(var(--slot) * 1.2);
  background: rgba(255, 255, 255, 0.14);
}
.inv-grid {
  display: grid;
  grid-template-columns: repeat(9, var(--slot));
  gap: 3px;
  margin-bottom: 10px;
}
.inv-hotbar {
  display: grid;
  grid-template-columns: repeat(9, var(--slot));
  gap: 3px;
  padding-top: 8px;
  border-top: 2px solid rgba(255, 255, 255, 0.12);
}
.furnace-top { align-items: center; }
.furnace-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fire {
  width: 26px;
  height: 26px;
  background: radial-gradient(circle at 50% 70%, #ffd24a, #e2560c 60%, transparent 70%);
  opacity: 0.15;
  border-radius: 50%;
}
.creative-search {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px 12px;
  font-size: 14px;
  border-radius: 6px;
  border: 2px solid rgba(255, 255, 255, 0.18);
  background: rgba(0, 0, 0, 0.35);
  color: #fff;
  outline: none;
}
.creative-grid {
  display: grid;
  grid-template-columns: repeat(12, var(--slot));
  gap: 3px;
  max-height: 42vh;
  overflow-y: auto;
  margin-bottom: 14px;
  padding-right: 6px;
}

.cursor-item {
  position: absolute;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  pointer-events: none;
  z-index: 100;
}
.cursor-item canvas { width: 48px; height: 48px; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.5)); }
.cursor-item .count {
  position: absolute;
  right: 0;
  bottom: -2px;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.85);
}

.tooltip {
  position: absolute;
  padding: 6px 10px;
  background: rgba(16, 8, 24, 0.94);
  border: 1px solid rgba(160, 120, 220, 0.55);
  border-radius: 4px;
  font-size: 13px;
  pointer-events: none;
  z-index: 120;
  white-space: nowrap;
}
.tooltip .sub { color: #a8a8b8; font-size: 12px; margin-top: 3px; }

/* ── 死亡界面 ── */
.death {
  position: absolute;
  inset: 0;
  background: rgba(120, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
}
.death-box { text-align: center; }
.death-box h1 { font-size: 46px; margin: 0 0 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.6); }
.death-box p { margin: 0 0 22px; opacity: 0.85; }
.death-box button, #loading button {
  padding: 12px 42px;
  font-size: 16px;
  font-family: inherit;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  cursor: pointer;
}
.death-box button:hover { background: rgba(255, 255, 255, 0.26); }

/* ── 加载界面 ── */
#loading {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #1b2a45, #0b0e14 70%);
  transition: opacity 0.5s;
}
#loading.hidden { opacity: 0; pointer-events: none; display: flex !important; }
.loading-inner { text-align: center; max-width: 560px; padding: 20px; }
.loading-inner h1 {
  font-size: 44px;
  margin: 0 0 6px;
  letter-spacing: 8px;
  background: linear-gradient(180deg, #cfe6ff, #6f9ad8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.loading-inner .sub { margin: 0 0 28px; color: #8fa8c8; letter-spacing: 2px; }
.spinner {
  width: 38px;
  height: 38px;
  margin: 0 auto 18px;
  border: 4px solid rgba(255, 255, 255, 0.15);
  border-top-color: #7fb3ff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-status { color: #b8c8e0; font-size: 14px; min-height: 20px; }
.tips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 26px;
}
.tips span {
  padding: 5px 12px;
  font-size: 12px;
  color: #9fb4d0;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
}

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 5px; }

</style>
</head>
<body>
<canvas id="game"></canvas>
  <div id="ui"></div>

  <div id="loading">
    <div class="loading-inner">
      <h1>方块世界</h1>
      <p class="sub">程序化材质 · 无限地形 · 多生物群系</p>
      <div class="spinner"></div>
      <p id="loading-status">正在初始化…</p>
      <div class="tips">
        <span>WASD 移动</span><span>空格 跳跃</span><span>左键 挖掘</span>
        <span>右键 放置</span><span>E 背包</span><span>F1 帮助</span>
      </div>
    </div>
  </div>
<script type="module">

const __SOURCES = {"src/entity/mobs.js":"// 实体系统：生物 AI、掉落物、箭矢、爆炸\n\nimport { ID, getBlock, BLOCKS } from '../world/blocks.js';\nimport { getItem } from '../world/items.js';\nimport { Rand, clamp } from '../util/noise.js';\nimport { MODELS } from '../render/entities.js';\nimport { CHUNK_Y } from '../world/chunk.js';\n\nexport const MOB_TYPES = {\n  pig: {\n    display: '猪', hostile: false, health: 10, speed: 1.5, width: 0.9, height: 0.9,\n    drops: [{ item: 'raw_porkchop', min: 1, max: 3 }], spawnOn: ['grass_block'], group: [2, 4],\n  },\n  cow: {\n    display: '牛', hostile: false, health: 10, speed: 1.4, width: 0.9, height: 1.4,\n    drops: [{ item: 'raw_beef', min: 1, max: 3 }, { item: 'leather', min: 0, max: 2 }],\n    spawnOn: ['grass_block'], group: [2, 4],\n  },\n  sheep: {\n    display: '羊', hostile: false, health: 8, speed: 1.4, width: 0.9, height: 1.3,\n    drops: [{ item: 'raw_mutton', min: 1, max: 2 }, { item: 'white_wool', min: 1, max: 1 }],\n    spawnOn: ['grass_block'], group: [2, 5],\n  },\n  chicken: {\n    display: '鸡', hostile: false, health: 4, speed: 1.3, width: 0.4, height: 0.7,\n    drops: [{ item: 'raw_chicken', min: 1, max: 1 }, { item: 'feather', min: 0, max: 2 }],\n    spawnOn: ['grass_block'], group: [2, 4],\n  },\n  zombie: {\n    display: '僵尸', hostile: true, health: 20, speed: 2.2, width: 0.6, height: 1.95,\n    damage: 3, drops: [{ item: 'rotten_flesh', min: 0, max: 2 }], burnsInDay: true, group: [1, 3],\n  },\n  skeleton: {\n    display: '骷髅', hostile: true, health: 20, speed: 2.3, width: 0.6, height: 1.95,\n    damage: 2, ranged: true, drops: [{ item: 'bone', min: 0, max: 2 }, { item: 'arrow', min: 0, max: 2 }],\n    burnsInDay: true, group: [1, 2],\n  },\n  creeper: {\n    display: '苦力怕', hostile: true, health: 20, speed: 2.0, width: 0.6, height: 1.7,\n    explodes: true, drops: [{ item: 'gunpowder', min: 0, max: 2 }], group: [1, 2],\n  },\n  spider: {\n    display: '蜘蛛', hostile: true, health: 16, speed: 2.9, width: 1.4, height: 0.9,\n    damage: 2, climbs: true, drops: [{ item: 'string', min: 0, max: 2 }], group: [1, 3],\n  },\n};\n\nconst GRAVITY = 26;\n\nexport class Mob {\n  constructor(type, x, y, z) {\n    const t = MOB_TYPES[type];\n    this.type = type;\n    this.def = t;\n    this.x = x; this.y = y; this.z = z;\n    this.vx = 0; this.vy = 0; this.vz = 0;\n    this.yaw = Math.random() * Math.PI * 2;\n    this.headYaw = this.yaw;\n    this.headPitch = 0;\n    this.health = t.health;\n    this.maxHealth = t.health;\n    this.onGround = false;\n    this.walkPhase = 0;\n    this.walkAmount = 0;\n    this.target = null;\n    this.wanderTimer = 0;\n    this.wanderDir = [0, 0];\n    this.attackCooldown = 0;\n    this.hurtTime = 0;\n    this.fuse = -1;\n    this.dead = false;\n    this.age = 0;\n    this.inWater = false;\n    this.jumpCooldown = 0;\n    this.burning = 0;\n  }\n\n  get width() { return this.def.width; }\n  get height() { return this.def.height; }\n\n  aabb() {\n    const h = this.width / 2;\n    return [this.x - h, this.y, this.z - h, this.x + h, this.y + this.height, this.z + h];\n  }\n\n  update(dt, world, player, entities) {\n    this.age += dt;\n    this.hurtTime = Math.max(0, this.hurtTime - dt);\n    this.attackCooldown = Math.max(0, this.attackCooldown - dt);\n    this.jumpCooldown = Math.max(0, this.jumpCooldown - dt);\n\n    const feet = world.getBlock(Math.floor(this.x), Math.floor(this.y + 0.2), Math.floor(this.z));\n    this.inWater = feet === ID.water;\n    if (feet === ID.lava) this.hurt(4 * dt * 2, world, entities);\n\n    // 白天燃烧\n    if (this.def.burnsInDay && world.isDay()) {\n      const sky = world.getSky(Math.floor(this.x), Math.floor(this.y + this.height), Math.floor(this.z));\n      if (sky >= 14) {\n        this.burning += dt;\n        if (this.burning > 1) { this.burning = 0; this.hurt(1, world, entities); }\n      }\n    }\n\n    this.think(dt, world, player, entities);\n\n    // 物理\n    if (!this.inWater) this.vy -= GRAVITY * dt;\n    else this.vy = clamp(this.vy + 6 * dt, -1.4, 1.6);\n    if (this.vy < -40) this.vy = -40;\n\n    this.moveAxis(world, 0, this.vx * dt);\n    const beforeY = this.y;\n    this.onGround = false;\n    this.moveAxis(world, 1, this.vy * dt);\n    this.moveAxis(world, 2, this.vz * dt);\n    void beforeY;\n\n    const hspeed = Math.hypot(this.vx, this.vz);\n    this.walkAmount = Math.min(0.85, hspeed * 0.32);\n    this.walkPhase += hspeed * dt * 5.5;\n    if (this.onGround) {\n      const drag = Math.pow(0.02, dt);\n      this.vx *= drag;\n      this.vz *= drag;\n    }\n\n    if (this.y < -6) this.dead = true;\n  }\n\n  moveAxis(world, axis, amount) {\n    if (amount === 0) return;\n    const h = this.width / 2;\n    let nx = this.x, ny = this.y, nz = this.z;\n    if (axis === 0) nx += amount;\n    else if (axis === 1) ny += amount;\n    else nz += amount;\n    if (!world.intersects(nx - h, ny, nz - h, nx + h, ny + this.height, nz + h)) {\n      if (axis === 0) this.x = nx;\n      else if (axis === 1) this.y = ny;\n      else this.z = nz;\n      return;\n    }\n    if (axis === 1) {\n      if (amount < 0) this.onGround = true;\n      this.vy = 0;\n      return;\n    }\n    // 被挡住 → 尝试跳过一格\n    if (this.onGround && this.jumpCooldown <= 0) {\n      const upY = this.y + 1.05;\n      if (!world.intersects(nx - h, upY, nz - h, nx + h, upY + this.height, nz + h)) {\n        this.vy = 7.6;\n        this.jumpCooldown = 0.35;\n      }\n    }\n    if (this.def.climbs) this.vy = Math.max(this.vy, 3.4);\n    if (axis === 0) this.vx = 0; else this.vz = 0;\n  }\n\n  think(dt, world, player, entities) {\n    const dx = player.x - this.x, dz = player.z - this.z, dy = player.y - this.y;\n    const dist = Math.hypot(dx, dy, dz);\n    const t = this.def;\n\n    if (t.hostile && !player.dead && player.gamemode !== 'creative' && dist < 18) {\n      this.target = player;\n    } else if (dist > 26) {\n      this.target = null;\n    }\n\n    if (this.target) {\n      const speed = t.speed * (this.hurtTime > 0 ? 1.3 : 1);\n      const len = Math.hypot(dx, dz) || 1;\n      this.yaw = Math.atan2(-dx, -dz);\n      this.headYaw = this.yaw;\n      this.headPitch = Math.atan2(dy + 1, len);\n\n      if (t.explodes) {\n        if (dist < 3.2) {\n          this.fuse = this.fuse < 0 ? 1.5 : this.fuse - dt;\n          this.vx *= 0.6; this.vz *= 0.6;\n          if (this.fuse <= 0) {\n            this.explode(world, player, entities);\n            return;\n          }\n        } else {\n          this.fuse = -1;\n          this.vx = (dx / len) * speed;\n          this.vz = (dz / len) * speed;\n        }\n      } else if (t.ranged) {\n        if (dist > 5) {\n          this.vx = (dx / len) * speed;\n          this.vz = (dz / len) * speed;\n        } else if (dist < 3.5) {\n          this.vx = -(dx / len) * speed * 0.6;\n          this.vz = -(dz / len) * speed * 0.6;\n        } else { this.vx *= 0.4; this.vz *= 0.4; }\n        if (this.attackCooldown <= 0 && dist < 16 && this.canSee(world, player)) {\n          this.attackCooldown = 2;\n          const a = new Arrow(this.x, this.y + this.height * 0.8, this.z);\n          const tx = player.x - this.x, ty = (player.y + 1.2) - (this.y + this.height * 0.8), tz = player.z - this.z;\n          const l = Math.hypot(tx, ty, tz) || 1;\n          const sp = 24;\n          a.vx = (tx / l) * sp; a.vy = (ty / l) * sp + l * 0.06; a.vz = (tz / l) * sp;\n          a.owner = 'mob';\n          entities.arrows.push(a);\n        }\n      } else {\n        this.vx = (dx / len) * speed;\n        this.vz = (dz / len) * speed;\n        if (dist < 1.6 && this.attackCooldown <= 0) {\n          this.attackCooldown = 1;\n          player.damage(t.damage || 2, t.display);\n          const kb = 5;\n          player.vx += (dx / len) * kb;\n          player.vz += (dz / len) * kb;\n          player.vy += 3;\n        }\n      }\n      return;\n    }\n\n    // 闲逛\n    this.wanderTimer -= dt;\n    if (this.wanderTimer <= 0) {\n      this.wanderTimer = 2 + Math.random() * 4;\n      if (Math.random() < 0.45) {\n        this.wanderDir = [0, 0];\n      } else {\n        const a = Math.random() * Math.PI * 2;\n        this.wanderDir = [Math.cos(a), Math.sin(a)];\n        this.yaw = Math.atan2(-this.wanderDir[0], -this.wanderDir[1]);\n      }\n    }\n    const ws = t.speed * 0.42;\n    this.vx = this.wanderDir[0] * ws;\n    this.vz = this.wanderDir[1] * ws;\n    this.headYaw = this.yaw;\n    this.headPitch *= 0.9;\n    // 被打后逃跑\n    if (this.hurtTime > 0 && !t.hostile) {\n      this.vx *= 3.4;\n      this.vz *= 3.4;\n    }\n  }\n\n  canSee(world, player) {\n    const dx = player.x - this.x;\n    const dy = (player.y + 1.2) - (this.y + this.height * 0.8);\n    const dz = player.z - this.z;\n    const l = Math.hypot(dx, dy, dz) || 1;\n    const hit = world.raycast(this.x, this.y + this.height * 0.8, this.z, dx / l, dy / l, dz / l, l);\n    return !hit;\n  }\n\n  hurt(amount, world, entities, knockback = null) {\n    if (this.dead) return;\n    this.health -= amount;\n    this.hurtTime = 0.35;\n    if (knockback) {\n      this.vx += knockback[0];\n      this.vy = Math.max(this.vy, 5);\n      this.vz += knockback[1];\n    }\n    if (this.health <= 0) {\n      this.dead = true;\n      this.dropLoot(entities);\n    }\n  }\n\n  dropLoot(entities) {\n    const rand = new Rand((this.x * 73856093) ^ (this.z * 19349663) ^ Math.floor(this.age * 1000));\n    for (const d of this.def.drops || []) {\n      const n = d.min + rand.int(d.max - d.min + 1);\n      if (n > 0) {\n        entities.spawnItem(this.x, this.y + this.height * 0.5, this.z, d.item, n);\n      }\n    }\n  }\n\n  explode(world, player, entities) {\n    this.dead = true;\n    entities.explode(world, this.x, this.y + 0.6, this.z, 3.0, player);\n  }\n}\n\nexport class ItemEntity {\n  constructor(x, y, z, item, count) {\n    this.x = x; this.y = y; this.z = z;\n    this.vx = (Math.random() - 0.5) * 2;\n    this.vy = 2.4 + Math.random();\n    this.vz = (Math.random() - 0.5) * 2;\n    this.item = item;\n    this.count = count;\n    this.age = 0;\n    this.pickupDelay = 0.5;\n    this.dead = false;\n    this.onGround = false;\n  }\n  update(dt, world) {\n    this.age += dt;\n    this.pickupDelay = Math.max(0, this.pickupDelay - dt);\n    if (this.age > 300) { this.dead = true; return; }\n    this.vy -= 22 * dt;\n    const inWater = world.getBlock(Math.floor(this.x), Math.floor(this.y), Math.floor(this.z)) === ID.water;\n    if (inWater) this.vy = clamp(this.vy + 30 * dt, -1, 1.2);\n    const r = 0.14;\n    const tryMove = (ax, amt) => {\n      let nx = this.x, ny = this.y, nz = this.z;\n      if (ax === 0) nx += amt; else if (ax === 1) ny += amt; else nz += amt;\n      if (!world.intersects(nx - r, ny, nz - r, nx + r, ny + r * 2, nz + r)) {\n        if (ax === 0) this.x = nx; else if (ax === 1) this.y = ny; else this.z = nz;\n      } else {\n        if (ax === 1) { if (amt < 0) this.onGround = true; this.vy = 0; }\n        else if (ax === 0) this.vx = 0;\n        else this.vz = 0;\n      }\n    };\n    this.onGround = false;\n    tryMove(1, this.vy * dt);\n    tryMove(0, this.vx * dt);\n    tryMove(2, this.vz * dt);\n    const drag = Math.pow(this.onGround ? 0.008 : 0.6, dt);\n    this.vx *= drag;\n    this.vz *= drag;\n    if (this.y < -6) this.dead = true;\n  }\n}\n\nexport class Arrow {\n  constructor(x, y, z) {\n    this.x = x; this.y = y; this.z = z;\n    this.vx = 0; this.vy = 0; this.vz = 0;\n    this.age = 0;\n    this.dead = false;\n    this.stuck = false;\n    this.owner = 'player';\n    this.damage = 5;\n  }\n  update(dt, world, player, entities) {\n    this.age += dt;\n    if (this.age > 60 || this.stuck && this.age > 12) { this.dead = true; return; }\n    if (this.stuck) return;\n    this.vy -= 20 * dt;\n    const nx = this.x + this.vx * dt;\n    const ny = this.y + this.vy * dt;\n    const nz = this.z + this.vz * dt;\n    const dx = nx - this.x, dy = ny - this.y, dz = nz - this.z;\n    const len = Math.hypot(dx, dy, dz);\n    if (len > 0) {\n      const hit = world.raycast(this.x, this.y, this.z, dx / len, dy / len, dz / len, len);\n      if (hit) { this.stuck = true; this.age = 0; return; }\n    }\n    this.x = nx; this.y = ny; this.z = nz;\n\n    if (this.owner === 'player') {\n      for (const m of entities.mobs) {\n        if (m.dead) continue;\n        const [x0, y0, z0, x1, y1, z1] = m.aabb();\n        if (this.x > x0 - 0.1 && this.x < x1 + 0.1 && this.y > y0 - 0.1 &&\n            this.y < y1 + 0.1 && this.z > z0 - 0.1 && this.z < z1 + 0.1) {\n          const l = Math.hypot(this.vx, this.vz) || 1;\n          m.hurt(this.damage, world, entities, [this.vx / l * 3, this.vz / l * 3]);\n          this.dead = true;\n          return;\n        }\n      }\n    } else {\n      const [x0, y0, z0, x1, y1, z1] = [player.x - 0.3, player.y, player.z - 0.3, player.x + 0.3, player.y + 1.8, player.z + 0.3];\n      if (this.x > x0 && this.x < x1 && this.y > y0 && this.y < y1 && this.z > z0 && this.z < z1) {\n        player.damage(this.damage, '骷髅');\n        this.dead = true;\n      }\n    }\n  }\n}\n\n/** 实体管理器 */\nexport class Entities {\n  constructor(world) {\n    this.world = world;\n    this.mobs = [];\n    this.items = [];\n    this.arrows = [];\n    this.particles = [];\n    this.spawnTimer = 0;\n    this.maxMobs = 40;\n  }\n\n  spawnItem(x, y, z, item, count) {\n    if (!getItem(item)) return;\n    const max = getItem(item).stack;\n    while (count > 0) {\n      const n = Math.min(max, count);\n      this.items.push(new ItemEntity(x, y, z, item, n));\n      count -= n;\n    }\n  }\n\n  update(dt, player) {\n    const world = this.world;\n    for (const m of this.mobs) m.update(dt, world, player, this);\n    for (const it of this.items) it.update(dt, world);\n    for (const a of this.arrows) a.update(dt, world, player, this);\n\n    // 拾取\n    for (const it of this.items) {\n      if (it.dead || it.pickupDelay > 0) continue;\n      const dx = player.x - it.x, dy = (player.y + 0.9) - it.y, dz = player.z - it.z;\n      const d = Math.hypot(dx, dy, dz);\n      if (d < 1.6) {\n        if (d > 0.4) {\n          it.vx += (dx / d) * 12 * dt;\n          it.vy += (dy / d) * 12 * dt;\n          it.vz += (dz / d) * 12 * dt;\n        }\n        if (d < 1.0 && player.inventory.canFit(it.item, it.count)) {\n          const left = player.give(it.item, it.count);\n          if (left === 0) { it.dead = true; this.onPickup && this.onPickup(it.item, it.count); }\n          else it.count = left;\n        }\n      }\n    }\n    // 合并掉落物\n    for (let i = 0; i < this.items.length; i++) {\n      const a = this.items[i];\n      if (a.dead) continue;\n      for (let j = i + 1; j < this.items.length; j++) {\n        const b = this.items[j];\n        if (b.dead || b.item !== a.item) continue;\n        if (Math.abs(a.x - b.x) < 0.6 && Math.abs(a.y - b.y) < 0.6 && Math.abs(a.z - b.z) < 0.6) {\n          const max = getItem(a.item).stack;\n          const move = Math.min(max - a.count, b.count);\n          if (move > 0) { a.count += move; b.count -= move; if (b.count <= 0) b.dead = true; }\n        }\n      }\n    }\n\n    this.mobs = this.mobs.filter((m) => !m.dead && Math.hypot(m.x - player.x, m.z - player.z) < 110);\n    this.items = this.items.filter((i) => !i.dead);\n    this.arrows = this.arrows.filter((a) => !a.dead);\n\n    this.spawnTimer -= dt;\n    if (this.spawnTimer <= 0) {\n      this.spawnTimer = 2.5;\n      this.trySpawn(player);\n    }\n  }\n\n  trySpawn(player) {\n    const world = this.world;\n    if (this.mobs.length >= this.maxMobs) return;\n    const night = !world.isDay();\n    for (let attempt = 0; attempt < 12; attempt++) {\n      const ang = Math.random() * Math.PI * 2;\n      const r = 26 + Math.random() * 34;\n      const x = Math.floor(player.x + Math.cos(ang) * r);\n      const z = Math.floor(player.z + Math.sin(ang) * r);\n      if (!world.chunkAt(x, z)) continue;\n      const y = world.surfaceY(x, z);\n      if (y <= 1 || y >= CHUNK_Y - 2) continue;\n      const ground = world.getBlock(x, y - 1, z);\n      const gb = getBlock(ground);\n      if (!gb.solid || ground === ID.water) continue;\n      if (world.getBlock(x, y, z) !== 0 || world.getBlock(x, y + 1, z) !== 0) continue;\n\n      const sky = world.getSky(x, y, z);\n      const blockLight = world.getBlockLight(x, y, z);\n      const biome = world.getBiomeAt(x, z);\n      const light = Math.max(night ? 0 : sky, blockLight);\n\n      let type = null;\n      if (light <= 7 && (night || sky < 4)) {\n        const hostiles = ['zombie', 'zombie', 'skeleton', 'creeper', 'spider'];\n        type = hostiles[Math.floor(Math.random() * hostiles.length)];\n      } else if (sky >= 9 && ground === ID.grass_block && biome.passiveMobs.length) {\n        const passives = ['pig', 'cow', 'sheep', 'chicken'];\n        type = passives[Math.floor(Math.random() * passives.length)];\n        if (this.mobs.filter((m) => !MOB_TYPES[m.type].hostile).length > 18) return;\n      }\n      if (!type) continue;\n\n      const [gmin, gmax] = MOB_TYPES[type].group;\n      const n = gmin + Math.floor(Math.random() * (gmax - gmin + 1));\n      for (let i = 0; i < n && this.mobs.length < this.maxMobs; i++) {\n        const ox = x + (Math.random() - 0.5) * 4;\n        const oz = z + (Math.random() - 0.5) * 4;\n        const oy = world.surfaceY(Math.floor(ox), Math.floor(oz));\n        if (world.getBlock(Math.floor(ox), oy, Math.floor(oz)) !== 0) continue;\n        this.mobs.push(new Mob(type, ox + 0.5, oy, oz + 0.5));\n      }\n      return;\n    }\n  }\n\n  /** 爆炸：破坏方块 + 击伤实体 */\n  explode(world, x, y, z, power, player) {\n    const r = Math.ceil(power);\n    for (let dy = -r; dy <= r; dy++) {\n      for (let dz = -r; dz <= r; dz++) {\n        for (let dx = -r; dx <= r; dx++) {\n          const d = Math.hypot(dx, dy, dz);\n          if (d > power) continue;\n          const bx = Math.floor(x) + dx, by = Math.floor(y) + dy, bz = Math.floor(z) + dz;\n          const id = world.getBlock(bx, by, bz);\n          if (id === 0) continue;\n          const b = BLOCKS[id];\n          if (!b || b.hardness < 0) continue;\n          const resist = b.name === 'obsidian' ? 60 : b.hardness;\n          if (resist > 8) continue;\n          if (Math.random() > 1 - d / power * 0.5) continue;\n          world.setBlock(bx, by, bz, 0);\n          if (Math.random() < 0.3) {\n            const drops = b.drops;\n            if (typeof drops === 'string') this.spawnItem(bx + 0.5, by + 0.5, bz + 0.5, drops, 1);\n          }\n        }\n      }\n    }\n    // 伤害\n    for (const m of this.mobs) {\n      const d = Math.hypot(m.x - x, m.y - y, m.z - z);\n      if (d < power * 2) {\n        const f = 1 - d / (power * 2);\n        m.hurt(power * 6 * f, world, this, [(m.x - x) * f, (m.z - z) * f]);\n      }\n    }\n    const pd = Math.hypot(player.x - x, player.y - y, player.z - z);\n    if (pd < power * 2) {\n      const f = 1 - pd / (power * 2);\n      player.damage(power * 6 * f, '爆炸');\n      player.vx += (player.x - x) * f * 2;\n      player.vy += 6 * f;\n      player.vz += (player.z - z) * f * 2;\n    }\n    this.addParticles(x, y, z, 30);\n  }\n\n  addParticles(x, y, z, n) {\n    for (let i = 0; i < n; i++) {\n      this.particles.push({\n        x, y, z,\n        vx: (Math.random() - 0.5) * 6,\n        vy: Math.random() * 5,\n        vz: (Math.random() - 0.5) * 6,\n        life: 0.6 + Math.random() * 0.6,\n      });\n    }\n    if (this.particles.length > 400) this.particles.splice(0, this.particles.length - 400);\n  }\n}\n\nexport { MODELS };\n","src/entity/player.js":"// 玩家：移动物理、挖掘、生命与饥饿、装备\n\nimport { Inventory, makeStack, maxStack } from '../world/inventory.js';\nimport { getBlock, ID, blockDrops, RT, TIER } from '../world/blocks.js';\nimport { getItem } from '../world/items.js';\nimport { CHUNK_Y } from '../world/chunk.js';\n\nconst WIDTH = 0.6;\nconst HEIGHT = 1.8;\nconst EYE = 1.62;\nconst GRAVITY = 30;\nconst JUMP_V = 8.6;\nconst TERMINAL = 60;\n\nexport class Player {\n  constructor(world) {\n    this.world = world;\n    this.x = 0.5; this.y = 80; this.z = 0.5;\n    this.vx = 0; this.vy = 0; this.vz = 0;\n    this.yaw = 0; this.pitch = 0;\n    this.onGround = false;\n    this.inWater = false;\n    this.inLava = false;\n    this.onLadder = false;\n    this.sneaking = false;\n    this.sprinting = false;\n    this.flying = false;\n    this.gamemode = 'survival';\n\n    this.health = 20;\n    this.maxHealth = 20;\n    this.food = 20;\n    this.saturation = 5;\n    this.exhaustion = 0;\n    this.air = 300;\n    this.hurtCooldown = 0;\n    this.regenTimer = 0;\n    this.dead = false;\n\n    this.inventory = new Inventory(36);      // 0-8 快捷栏，9-35 背包\n    this.armor = new Inventory(4);\n    this.hotbar = 0;\n    this.cursor = null;                      // 鼠标拖着的物品\n\n    this.mining = null;                      // { x,y,z, progress, total }\n    this.attackCooldown = 0;\n    this.swingTime = 0;\n    this.bobPhase = 0;\n    this.fallStart = null;\n    this.spawnPoint = null;\n    this.eatTimer = 0;\n    this.tmpBoxes = [];\n  }\n\n  get eyeY() {\n    return this.y + (this.sneaking ? EYE - 0.15 : EYE);\n  }\n\n  get heldItem() {\n    return this.inventory.get(this.hotbar);\n  }\n\n  get toolTier() {\n    const s = this.heldItem;\n    if (!s) return TIER.NONE;\n    const it = getItem(s.item);\n    return it && it.tool ? it.tool.tier : TIER.NONE;\n  }\n\n  get toolType() {\n    const s = this.heldItem;\n    if (!s) return null;\n    const it = getItem(s.item);\n    return it && it.tool ? it.tool.type : null;\n  }\n\n  get armorPoints() {\n    let n = 0;\n    for (const s of this.armor.slots) {\n      if (!s) continue;\n      const it = getItem(s.item);\n      if (it && it.armor) n += it.armor.defense;\n    }\n    return n;\n  }\n\n  aabb(x = this.x, y = this.y, z = this.z) {\n    const h = WIDTH / 2;\n    return [x - h, y, z - h, x + h, y + HEIGHT, z + h];\n  }\n\n  // ── 输入驱动的移动 ──\n  update(dt, input) {\n    if (this.dead) return;\n    dt = Math.min(dt, 0.06);\n    this.hurtCooldown = Math.max(0, this.hurtCooldown - dt);\n    this.attackCooldown = Math.max(0, this.attackCooldown - dt);\n    if (this.swingTime > 0) this.swingTime = Math.max(0, this.swingTime - dt * 3.2);\n\n    const feetBlock = this.world.getBlock(Math.floor(this.x), Math.floor(this.y + 0.4), Math.floor(this.z));\n    const headBlock = this.world.getBlock(Math.floor(this.x), Math.floor(this.eyeY), Math.floor(this.z));\n    this.inWater = feetBlock === ID.water || headBlock === ID.water;\n    this.headInWater = headBlock === ID.water;\n    this.inLava = feetBlock === ID.lava;\n    this.onLadder = this.world.getBlock(Math.floor(this.x), Math.floor(this.y + 0.5), Math.floor(this.z)) === ID.ladder;\n\n    const creative = this.gamemode === 'creative';\n    this.sneaking = input.sneak && !this.flying;\n    const wantSprint = input.sprint && input.forward > 0 && this.food > 6;\n    this.sprinting = wantSprint && !this.sneaking;\n\n    // 水平加速度\n    let speed = this.sneaking ? 1.35 : this.sprinting ? 5.7 : 4.35;\n    if (this.inWater) speed *= 0.55;\n    if (this.flying) speed = this.sprinting ? 22 : 11;\n\n    const sin = Math.sin(this.yaw), cos = Math.cos(this.yaw);\n    let mx = input.strafe * cos - input.forward * sin;\n    let mz = -input.strafe * sin - input.forward * cos;\n    const len = Math.hypot(mx, mz);\n    if (len > 1e-4) { mx /= len; mz /= len; } else { mx = 0; mz = 0; }\n\n    const accel = this.onGround || this.flying ? 34 : 9;\n    const targetX = mx * speed, targetZ = mz * speed;\n    this.vx += (targetX - this.vx) * Math.min(1, accel * dt);\n    this.vz += (targetZ - this.vz) * Math.min(1, accel * dt);\n\n    // 垂直\n    if (this.flying) {\n      const up = (input.jump ? 1 : 0) - (input.sneak ? 1 : 0);\n      this.vy += (up * speed - this.vy) * Math.min(1, 18 * dt);\n    } else if (this.inWater || this.inLava) {\n      const drag = this.inLava ? 0.5 : 0.8;\n      this.vy -= GRAVITY * 0.32 * dt;\n      this.vy *= Math.pow(drag, dt * 10);\n      if (input.jump) this.vy = Math.min(this.vy + 26 * dt, 3.2);\n      if (this.vy < -6) this.vy = -6;\n    } else if (this.onLadder) {\n      this.vy = input.jump ? 3.2 : input.sneak ? -1.2 : (this.vy < -2.4 ? -2.4 : this.vy - GRAVITY * dt * 0.2);\n      if (Math.abs(input.forward) > 0.1 && !input.jump && !input.sneak) this.vy = 2.4;\n    } else {\n      this.vy -= GRAVITY * dt;\n      if (this.vy < -TERMINAL) this.vy = -TERMINAL;\n      if (input.jump && this.onGround) {\n        this.vy = JUMP_V;\n        this.onGround = false;\n        if (this.sprinting) this.exhaustion += 0.2;\n        else this.exhaustion += 0.05;\n      }\n    }\n\n    this.move(dt, creative && this.flying);\n\n    // 移动消耗\n    const dist = Math.hypot(this.vx, this.vz) * dt;\n    if (this.onGround && !creative) {\n      this.exhaustion += dist * (this.sprinting ? 0.1 : 0.01);\n    }\n    this.bobPhase += dist * 3.4;\n    this.updateVitals(dt);\n  }\n\n  move(dt, noclip) {\n    if (noclip) {\n      this.x += this.vx * dt;\n      this.y += this.vy * dt;\n      this.z += this.vz * dt;\n      this.onGround = false;\n      return;\n    }\n    const world = this.world;\n    const step = (axis, amount) => {\n      if (amount === 0) return;\n      const h = WIDTH / 2;\n      let nx = this.x, ny = this.y, nz = this.z;\n      if (axis === 0) nx += amount;\n      else if (axis === 1) ny += amount;\n      else nz += amount;\n      const box = [nx - h, ny, nz - h, nx + h, ny + HEIGHT, nz + h];\n      if (!world.intersects(...box)) {\n        if (axis === 0) this.x = nx;\n        else if (axis === 1) { this.y = ny; }\n        else this.z = nz;\n        return;\n      }\n      // 撞上了：细分逼近\n      let lo = 0, hi = amount;\n      for (let i = 0; i < 8; i++) {\n        const mid = (lo + hi) / 2;\n        let tx = this.x, ty = this.y, tz = this.z;\n        if (axis === 0) tx += mid;\n        else if (axis === 1) ty += mid;\n        else tz += mid;\n        if (!world.intersects(tx - h, ty, tz - h, tx + h, ty + HEIGHT, tz + h)) lo = mid;\n        else hi = mid;\n      }\n      if (axis === 0) { this.x += lo; this.vx = 0; }\n      else if (axis === 1) {\n        this.y += lo;\n        if (amount < 0) {\n          this.onGround = true;\n          this.handleFall();\n        }\n        this.vy = 0;\n      } else { this.z += lo; this.vz = 0; }\n    };\n\n    const wasGround = this.onGround;\n    this.onGround = false;\n    step(1, this.vy * dt);\n\n    // 自动上台阶\n    const beforeX = this.x, beforeZ = this.z;\n    const dx = this.vx * dt, dz = this.vz * dt;\n    step(0, dx);\n    step(2, dz);\n    const movedX = Math.abs(this.x - beforeX), movedZ = Math.abs(this.z - beforeZ);\n    if ((wasGround || this.onGround) && !this.flying &&\n        (movedX < Math.abs(dx) - 1e-4 || movedZ < Math.abs(dz) - 1e-4)) {\n      const saveX = this.x, saveY = this.y, saveZ = this.z;\n      const h = WIDTH / 2;\n      const upY = this.y + 0.62;\n      if (!this.world.intersects(this.x - h, upY, this.z - h, this.x + h, upY + HEIGHT, this.z + h)) {\n        this.y = upY;\n        const bx = this.x, bz = this.z;\n        step(0, dx - (this.x - beforeX));\n        step(2, dz - (this.z - beforeZ));\n        if (Math.abs(this.x - bx) < 1e-4 && Math.abs(this.z - bz) < 1e-4) {\n          this.x = saveX; this.y = saveY; this.z = saveZ;\n        } else {\n          this.onGround = true;\n        }\n      }\n    }\n\n    if (!this.onGround && this.vy <= 0 && this.fallStart === null && !this.flying) {\n      this.fallStart = this.y;\n    }\n    if (this.onGround) this.fallStart = null;\n    if (this.y < -8) this.damage(4, '虚空');\n  }\n\n  handleFall() {\n    if (this.fallStart === null || this.gamemode === 'creative') { this.fallStart = null; return; }\n    const dist = this.fallStart - this.y;\n    this.fallStart = null;\n    if (this.inWater) return;\n    if (dist > 3.5) {\n      this.damage(Math.floor(dist - 3), '摔落');\n    }\n  }\n\n  updateVitals(dt) {\n    if (this.gamemode === 'creative') { this.health = this.maxHealth; return; }\n    // 饥饿\n    if (this.exhaustion >= 4) {\n      this.exhaustion -= 4;\n      if (this.saturation > 0) this.saturation = Math.max(0, this.saturation - 1);\n      else this.food = Math.max(0, this.food - 1);\n    }\n    // 自然回血\n    if (this.food >= 18 && this.health < this.maxHealth) {\n      this.regenTimer += dt;\n      if (this.regenTimer > 3.5) {\n        this.regenTimer = 0;\n        this.health = Math.min(this.maxHealth, this.health + 1);\n        this.exhaustion += 1.5;\n      }\n    } else this.regenTimer = 0;\n    // 饿死\n    if (this.food <= 0) {\n      this.starveTimer = (this.starveTimer || 0) + dt;\n      if (this.starveTimer > 4) {\n        this.starveTimer = 0;\n        this.damage(1, '饥饿');\n      }\n    }\n    // 溺水\n    if (this.headInWater) {\n      this.air -= dt * 60;\n      if (this.air <= 0) {\n        this.air = 0;\n        this.drownTimer = (this.drownTimer || 0) + dt;\n        if (this.drownTimer > 1) { this.drownTimer = 0; this.damage(2, '溺水'); }\n      }\n    } else {\n      this.air = Math.min(300, this.air + dt * 180);\n    }\n    // 岩浆 / 仙人掌\n    if (this.inLava) {\n      this.lavaTimer = (this.lavaTimer || 0) + dt;\n      if (this.lavaTimer > 0.5) { this.lavaTimer = 0; this.damage(4, '岩浆'); }\n    }\n    const touching = this.touchingBlock(ID.cactus);\n    if (touching) {\n      this.cactusTimer = (this.cactusTimer || 0) + dt;\n      if (this.cactusTimer > 0.5) { this.cactusTimer = 0; this.damage(1, '仙人掌'); }\n    }\n  }\n\n  touchingBlock(id) {\n    const h = WIDTH / 2 + 0.05;\n    for (let y = Math.floor(this.y); y <= Math.floor(this.y + HEIGHT); y++) {\n      for (let z = Math.floor(this.z - h); z <= Math.floor(this.z + h); z++) {\n        for (let x = Math.floor(this.x - h); x <= Math.floor(this.x + h); x++) {\n          if (this.world.getBlock(x, y, z) === id) return true;\n        }\n      }\n    }\n    return false;\n  }\n\n  damage(amount, cause = '') {\n    if (this.gamemode === 'creative' || this.dead) return;\n    if (this.hurtCooldown > 0) return;\n    const reduction = Math.min(0.8, this.armorPoints * 0.04);\n    const real = Math.max(0.5, amount * (1 - reduction));\n    this.health -= real;\n    this.hurtCooldown = 0.5;\n    this.damageCause = cause;\n    this.damageBlend = 1;\n    this.damageArmor(Math.max(1, Math.floor(amount / 4)));\n    if (this.health <= 0) {\n      this.health = 0;\n      this.dead = true;\n    }\n  }\n\n  damageArmor(n) {\n    for (let i = 0; i < 4; i++) {\n      const s = this.armor.get(i);\n      if (!s || s.durability === null) continue;\n      s.durability -= n;\n      if (s.durability <= 0) this.armor.set(i, null);\n    }\n  }\n\n  heal(n) {\n    this.health = Math.min(this.maxHealth, this.health + n);\n  }\n\n  eat() {\n    const s = this.heldItem;\n    if (!s) return false;\n    const it = getItem(s.item);\n    if (!it || !it.food) return false;\n    if (this.food >= 20 && !it.food.poison) return false;\n    this.food = Math.min(20, this.food + it.food.hunger);\n    this.saturation = Math.min(this.food, this.saturation + it.food.saturation);\n    if (it.food.poison) this.damage(1, '食物中毒');\n    s.count--;\n    if (it.food.container) this.inventory.add(it.food.container, 1);\n    if (s.count <= 0) this.inventory.set(this.hotbar, null);\n    return true;\n  }\n\n  respawn(world) {\n    this.dead = false;\n    this.health = this.maxHealth;\n    this.food = 20;\n    this.saturation = 5;\n    this.air = 300;\n    this.vx = this.vy = this.vz = 0;\n    const sp = this.spawnPoint || { x: 0.5, z: 0.5 };\n    this.x = sp.x; this.z = sp.z;\n    for (let i = 0; i < 8; i++) {\n      world.ensureChunk((this.x >> 4) + (i % 3) - 1, (this.z >> 4) + Math.floor(i / 3) - 1);\n    }\n    this.y = world.surfaceY(Math.floor(this.x), Math.floor(this.z)) + 0.2;\n  }\n\n  // ── 挖掘 ──\n  breakTime(blockId) {\n    const b = getBlock(blockId);\n    if (b.hardness < 0) return Infinity;\n    if (this.gamemode === 'creative') return 0;\n    const s = this.heldItem;\n    const it = s ? getItem(s.item) : null;\n    let speed = 1;\n    if (it && it.tool) {\n      if (it.tool.type === b.tool) speed = it.tool.speed;\n      else if (it.tool.type === 'shears' && (b.name.endsWith('_leaves') || b.tool === 'shears')) speed = 15;\n      else if (it.tool.type === 'sword' && b.render === RT.CROSS) speed = 15;\n    }\n    const canHarvest = b.tier === 0 || this.toolTier >= b.tier;\n    return (b.hardness * (canHarvest ? 1.5 : 5)) / speed;\n  }\n\n  /** 消耗工具耐久，返回是否损坏 */\n  damageTool(n = 1) {\n    if (this.gamemode === 'creative') return false;\n    const s = this.heldItem;\n    if (!s || s.durability === null) return false;\n    s.durability -= n;\n    if (s.durability <= 0) {\n      this.inventory.set(this.hotbar, null);\n      return true;\n    }\n    return false;\n  }\n\n  give(item, count = 1) {\n    return this.inventory.add(item, count);\n  }\n}\n\nexport { WIDTH, HEIGHT, EYE, blockDrops, makeStack, maxStack, CHUNK_Y };\n","src/main.js":"// 游戏主循环：输入、交互、区块网格调度、渲染、存档\n\nimport { Renderer } from './render/renderer.js';\nimport { EntityRenderer, MODELS } from './render/entities.js';\nimport { buildIcons } from './render/icons.js';\nimport { buildChunkMesh } from './render/mesher.js';\nimport * as m4 from './util/mat4.js';\nimport { World, chunkKey } from './world/world.js';\nimport { CHUNK_X, CHUNK_Y, CHUNK_Z, SEA_LEVEL } from './world/chunk.js';\nimport { ID, BLOCKS, BLOCK_BY_NAME, getBlock, blockDrops, collisionBoxes, RT, TIER } from './world/blocks.js';\nimport { getItem } from './world/items.js';\nimport { Inventory, makeStack } from './world/inventory.js';\nimport { SMELTING, fuelValue } from './world/recipes.js';\nimport { Player } from './entity/player.js';\nimport { Entities, Arrow, MOB_TYPES } from './entity/mobs.js';\nimport { UI } from './ui/ui.js';\nimport { Sound, soundMaterial } from './ui/sound.js';\nimport { Rand } from './util/noise.js';\n\nconst SAVE_KEY = 'voxelcraft.save.v1';\n\nclass Game {\n  constructor() {\n    this.canvas = document.getElementById('game');\n    this.renderer = new Renderer(this.canvas);\n    this.sound = new Sound();\n    this.input = {\n      forward: 0, strafe: 0, jump: false, sneak: false, sprint: false,\n      mining: false, using: false,\n    };\n    this.keys = new Set();\n    this.paused = false;\n    this.renderDistance = 10;\n    this.lastTime = performance.now();\n    this.meshQueue = [];\n    this.activeFurnaces = new Map();\n    this.tickAccum = 0;\n    this.frameTimes = [];\n    this.pickTimer = 0;\n    this.lastPlaceTime = 0;\n    this.rand = new Rand(12345);\n  }\n\n  async boot(status) {\n    status('正在编译着色器…');\n    this.renderer.init();\n    this.renderer.renderDistance = this.renderDistance;\n\n    status('正在生成物品图标…');\n    await frame();\n    const iconData = buildIcons(this.renderer.textureData);\n    this.iconData = iconData;\n\n    status('正在准备实体…');\n    this.entityRenderer = new EntityRenderer(this.renderer);\n    this.entityRenderer.init(iconData.atlas);\n    this.atlasCols = iconData.cols;\n\n    status('正在生成世界…');\n    await frame();\n    const save = this.loadSave();\n    this.world = new World(save ? save.seed : (Math.random() * 1e9) | 0);\n    this.world.onChunkDirty = (c) => this.queueMesh(c);\n    this.player = new Player(this.world);\n    this.entities = new Entities(this.world);\n    this.entities.onPickup = () => this.sound.play('pickup');\n\n    this.ui = new UI(this, iconData.icons);\n\n    if (save) this.applySave(save);\n    else this.spawnPlayer();\n\n    // 预加载出生点周围\n    status('正在加载区块…');\n    for (let i = 0; i < 3; i++) {\n      this.world.genBudget = 64;\n      this.world.update(this.player.x, this.player.z, 3);\n      await frame();\n    }\n    this.world.genBudget = 2;\n    this.buildInitialMeshes();\n\n    this.bindInput();\n    this.ui.refresh();\n    this.ui.showToast('按 F1 查看操作说明', 4000);\n    requestAnimationFrame(() => this.loop());\n  }\n\n  spawnPlayer() {\n    const w = this.world;\n    // 螺旋向外搜索一块高于海平面的陆地\n    let x = 0, z = 0, found = false;\n    for (let ring = 0; ring < 120 && !found; ring++) {\n      const r = ring * 24;\n      const samples = ring === 0 ? 1 : Math.min(48, 6 + ring * 3);\n      for (let i = 0; i < samples; i++) {\n        const a = (i / samples) * Math.PI * 2 + ring * 0.7;\n        const tx = Math.round(Math.cos(a) * r);\n        const tz = Math.round(Math.sin(a) * r);\n        const h = w.gen.heightAt(tx, tz);\n        if (h > SEA_LEVEL + 2 && h < SEA_LEVEL + 40) {\n          const b = w.gen.biomeAt(tx, tz);\n          if (b.name !== 'ocean' && b.name !== 'deep_ocean' && b.name !== 'river') {\n            x = tx; z = tz; found = true;\n            break;\n          }\n        }\n      }\n    }\n    for (let cx = -2; cx <= 2; cx++) {\n      for (let cz = -2; cz <= 2; cz++) w.ensureChunk((x >> 4) + cx, (z >> 4) + cz);\n    }\n    this.player.x = x + 0.5;\n    this.player.z = z + 0.5;\n    this.player.y = w.surfaceY(x, z) + 0.5;\n    this.player.spawnPoint = { x: this.player.x, z: this.player.z };\n    this.player.give('wooden_pickaxe', 1);\n    this.player.give('wooden_axe', 1);\n    this.player.give('torch', 16);\n    this.player.give('bread', 4);\n  }\n\n  buildInitialMeshes() {\n    for (const c of this.world.chunks.values()) {\n      if (c.lit) this.queueMesh(c);\n    }\n    this.processMeshQueue(200);\n  }\n\n  queueMesh(chunk) {\n    if (!chunk.queued) {\n      chunk.queued = true;\n      this.meshQueue.push(chunk);\n    }\n  }\n\n  processMeshQueue(budget = 3) {\n    const w = this.world;\n    let done = 0;\n    // 优先处理离玩家近的\n    if (this.meshQueue.length > 6) {\n      const px = this.player.x, pz = this.player.z;\n      this.meshQueue.sort((a, b) => {\n        const da = (a.cx * 16 - px) ** 2 + (a.cz * 16 - pz) ** 2;\n        const db = (b.cx * 16 - px) ** 2 + (b.cz * 16 - pz) ** 2;\n        return da - db;\n      });\n    }\n    while (this.meshQueue.length && done < budget) {\n      const c = this.meshQueue.shift();\n      c.queued = false;\n      if (!w.chunks.has(chunkKey(c.cx, c.cz))) continue;\n      if (!c.lit) { continue; }\n      const mesh = buildChunkMesh(w, c);\n      this.renderer.uploadChunk(c, mesh);\n      c.dirty = false;\n      done++;\n    }\n  }\n\n  // ── 输入 ──\n  bindInput() {\n    const canvas = this.canvas;\n    canvas.addEventListener('click', () => {\n      if (!this.ui.screen && !this.player.dead) {\n        canvas.requestPointerLock();\n        this.sound.resume();\n      }\n    });\n    document.addEventListener('pointerlockchange', () => {\n      this.locked = document.pointerLockElement === canvas;\n      document.body.classList.toggle('locked', this.locked);\n    });\n    document.addEventListener('mousemove', (e) => {\n      if (!this.locked) return;\n      const s = 0.0022;\n      this.player.yaw -= e.movementX * s;\n      this.player.pitch -= e.movementY * s;\n      const lim = Math.PI / 2 - 0.001;\n      this.player.pitch = Math.max(-lim, Math.min(lim, this.player.pitch));\n    });\n    document.addEventListener('mousedown', (e) => {\n      if (this.ui.screen || !this.locked) return;\n      if (e.button === 0) { this.input.mining = true; this.onAttack(); }\n      if (e.button === 2) { this.input.using = true; this.onUse(); }\n      if (e.button === 1) { this.pickBlock(); e.preventDefault(); }\n    });\n    document.addEventListener('mouseup', (e) => {\n      if (e.button === 0) { this.input.mining = false; this.player.mining = null; }\n      if (e.button === 2) this.input.using = false;\n    });\n    document.addEventListener('contextmenu', (e) => e.preventDefault());\n    document.addEventListener('wheel', (e) => {\n      if (this.ui.screen) return;\n      const d = Math.sign(e.deltaY);\n      this.player.hotbar = (this.player.hotbar + d + 9) % 9;\n      this.onHotbarChange();\n    }, { passive: true });\n\n    document.addEventListener('keydown', (e) => this.onKey(e, true));\n    document.addEventListener('keyup', (e) => this.onKey(e, false));\n    window.addEventListener('beforeunload', () => this.save());\n  }\n\n  onKey(e, down) {\n    const code = e.code;\n    if (down) this.keys.add(code); else this.keys.delete(code);\n    const p = this.player;\n\n    if (down) {\n      if (code === 'Escape') {\n        if (this.ui.screen) { this.ui.close(); }\n        return;\n      }\n      if (code.startsWith('Digit')) {\n        const n = parseInt(code.slice(5), 10);\n        if (n >= 1 && n <= 9) { p.hotbar = n - 1; this.onHotbarChange(); }\n      }\n      if (this.ui.screen) {\n        if (code === 'KeyE') this.ui.close();\n        return;\n      }\n      switch (code) {\n        case 'KeyE': this.ui.open('inventory'); break;\n        case 'F3': this.ui.toggleDebug(); e.preventDefault(); break;\n        case 'F1': this.showHelp(); e.preventDefault(); break;\n        case 'F5': this.thirdPerson = !this.thirdPerson; e.preventDefault(); break;\n        case 'KeyQ': this.dropHeld(e.shiftKey); break;\n        case 'KeyF': this.toggleGamemode(); break;\n        case 'KeyG': if (p.gamemode === 'creative') this.ui.open('creative'); break;\n        case 'KeyT': this.cycleTime(); break;\n        case 'KeyR': this.save(); this.ui.showToast('已保存到本地'); break;\n        case 'Minus':\n        case 'NumpadSubtract':\n          this.setRenderDistance(this.renderDistance - 1); break;\n        case 'Equal':\n        case 'NumpadAdd':\n          this.setRenderDistance(this.renderDistance + 1); break;\n        default: break;\n      }\n      if (code === 'Space' && p.gamemode === 'creative') {\n        const now = performance.now();\n        if (this.lastSpace && now - this.lastSpace < 300) {\n          p.flying = !p.flying;\n          p.vy = 0;\n          this.ui.showToast(p.flying ? '飞行：开' : '飞行：关');\n        }\n        this.lastSpace = now;\n      }\n    }\n\n    this.input.forward = (this.keys.has('KeyW') ? 1 : 0) - (this.keys.has('KeyS') ? 1 : 0);\n    this.input.strafe = (this.keys.has('KeyD') ? 1 : 0) - (this.keys.has('KeyA') ? 1 : 0);\n    this.input.jump = this.keys.has('Space');\n    this.input.sneak = this.keys.has('ShiftLeft') || this.keys.has('ShiftRight');\n    this.input.sprint = this.keys.has('ControlLeft') || this.keys.has('KeyR') === false && this.keys.has('ShiftLeft') === false && this.keys.has('ControlLeft');\n    this.input.sprint = this.keys.has('ControlLeft') || this.keys.has('ControlRight');\n  }\n\n  setRenderDistance(d) {\n    this.renderDistance = Math.max(3, Math.min(16, d));\n    this.renderer.renderDistance = this.renderDistance;\n    this.ui.showToast(`视距：${this.renderDistance} 区块`);\n  }\n\n  onHotbarChange() {\n    const s = this.player.heldItem;\n    if (s) {\n      const d = getItem(s.item);\n      this.ui.setItemName(d ? d.display : s.item);\n    } else this.ui.setItemName('');\n    this.ui.refresh();\n  }\n\n  toggleGamemode() {\n    const p = this.player;\n    p.gamemode = p.gamemode === 'survival' ? 'creative' : 'survival';\n    if (p.gamemode === 'survival') p.flying = false;\n    this.ui.showToast(`游戏模式：${p.gamemode === 'creative' ? '创造' : '生存'}`);\n    this.ui.refresh();\n  }\n\n  cycleTime() {\n    const t = this.world.time;\n    this.world.time = t > 3000 && t < 15000 ? 18000 : 6000;\n    this.ui.showToast(this.world.isDay() ? '时间：白天' : '时间：夜晚');\n  }\n\n  showHelp() {\n    this.ui.showToast(\n      'WASD 移动 · 空格跳跃 · Shift 潜行 · Ctrl 疾跑 · 左键挖掘/攻击 · 右键放置/使用 · ' +\n      'E 背包 · Q 丢弃 · 1-9 快捷栏 · F 切换生存/创造 · G 创造物品栏 · T 昼夜 · ' +\n      '+/- 视距 · F3 调试 · F5 视角 · R 保存',\n      9000,\n    );\n  }\n\n  // ── 交互 ──\n  targetBlock(maxDist = 5) {\n    const p = this.player;\n    const dir = this.lookDir();\n    return this.world.raycast(p.x, p.eyeY, p.z, dir[0], dir[1], dir[2], maxDist);\n  }\n\n  lookDir() {\n    const p = this.player;\n    const cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);\n    return [-Math.sin(p.yaw) * cp, sp, -Math.cos(p.yaw) * cp];\n  }\n\n  /** 视线内最近的生物 */\n  targetMob(maxDist = 4) {\n    const p = this.player;\n    const [dx, dy, dz] = this.lookDir();\n    let best = null, bestT = maxDist;\n    for (const m of this.entities.mobs) {\n      if (m.dead) continue;\n      const [x0, y0, z0, x1, y1, z1] = m.aabb();\n      const t = rayAABB(p.x, p.eyeY, p.z, dx, dy, dz, x0, y0, z0, x1, y1, z1);\n      if (t !== null && t < bestT) { bestT = t; best = m; }\n    }\n    return best;\n  }\n\n  onAttack() {\n    const p = this.player;\n    p.swingTime = 1;\n    const mob = this.targetMob(3.6);\n    const hit = this.targetBlock();\n    if (mob && (!hit || hit.dist > 3.4)) {\n      const item = p.heldItem ? getItem(p.heldItem.item) : null;\n      const dmg = item && item.tool ? item.tool.damage : 1;\n      const dx = mob.x - p.x, dz = mob.z - p.z;\n      const l = Math.hypot(dx, dz) || 1;\n      mob.hurt(dmg, this.world, this.entities, [dx / l * 5, dz / l * 5]);\n      if (item && item.tool) p.damageTool(1);\n      p.exhaustion += 0.1;\n      this.sound.play('mobhurt');\n      return;\n    }\n  }\n\n  onUse() {\n    const p = this.player;\n    p.swingTime = 1;\n    const held = p.heldItem;\n    const def = held ? getItem(held.item) : null;\n\n    // 弓\n    if (def && def.projectile) {\n      if (p.gamemode === 'creative' || p.inventory.count('arrow') > 0) {\n        if (p.gamemode !== 'creative') p.inventory.remove('arrow', 1);\n        const a = new Arrow(p.x, p.eyeY - 0.1, p.z);\n        const d = this.lookDir();\n        const sp = 42;\n        a.vx = d[0] * sp; a.vy = d[1] * sp; a.vz = d[2] * sp;\n        a.owner = 'player';\n        this.entities.arrows.push(a);\n        p.damageTool(1);\n        this.sound.play('bow');\n      }\n      return;\n    }\n\n    const hit = this.targetBlock();\n\n    // 与方块交互\n    if (hit && !p.sneaking) {\n      const b = getBlock(hit.id);\n      if (b.name === 'crafting_table') { this.ui.open('crafting_table'); this.sound.play('door'); return; }\n      if (b.name === 'furnace' || b.name === 'furnace_lit') { this.openFurnace(hit.x, hit.y, hit.z); return; }\n      if (b.name === 'chest') { this.openChest(hit.x, hit.y, hit.z); return; }\n      if (b.name === 'tnt' && def && def.tool && def.tool.type === 'igniter') {\n        this.world.setBlock(hit.x, hit.y, hit.z, 0);\n        setTimeout(() => this.entities.explode(this.world, hit.x + 0.5, hit.y + 0.5, hit.z + 0.5, 4, p), 1500);\n        this.sound.play('fuse');\n        p.damageTool(1);\n        return;\n      }\n    }\n\n    if (!held) return;\n\n    // 食物\n    if (def && def.food) {\n      if (p.eat()) { this.sound.play('eat'); this.ui.refresh(); }\n      return;\n    }\n    // 水桶\n    if (held.item === 'bucket') {\n      const liquidHit = this.world.raycast(p.x, p.eyeY, p.z, ...this.lookDir(), 5, true);\n      if (liquidHit && (liquidHit.id === ID.water || liquidHit.id === ID.lava)) {\n        if (this.world.getMeta(liquidHit.x, liquidHit.y, liquidHit.z) === 0) {\n          this.world.setBlock(liquidHit.x, liquidHit.y, liquidHit.z, 0);\n          held.count--;\n          if (held.count <= 0) p.inventory.set(p.hotbar, null);\n          p.give(liquidHit.id === ID.water ? 'water_bucket' : 'lava_bucket', 1);\n          this.sound.play('splash');\n          this.ui.refresh();\n        }\n      }\n      return;\n    }\n    if (held.item === 'water_bucket' || held.item === 'lava_bucket') {\n      if (!hit) return;\n      const [px, py, pz] = [hit.x + hit.face[0], hit.y + hit.face[1], hit.z + hit.face[2]];\n      this.world.setBlock(px, py, pz, held.item === 'water_bucket' ? ID.water : ID.lava, { meta: 0 });\n      this.world.scheduleFluid(px, py, pz, 2);\n      if (p.gamemode !== 'creative') {\n        p.inventory.set(p.hotbar, makeStack('bucket', 1));\n      }\n      this.sound.play('splash');\n      this.ui.refresh();\n      return;\n    }\n    // 锄头\n    if (def && def.tool && def.tool.type === 'hoe' && hit) {\n      const b = getBlock(hit.id);\n      if ((b.name === 'grass_block' || b.name === 'dirt' || b.name === 'coarse_dirt') &&\n          this.world.getBlock(hit.x, hit.y + 1, hit.z) === 0) {\n        this.world.setBlock(hit.x, hit.y, hit.z, ID.farmland);\n        p.damageTool(1);\n        this.sound.play('dig', 'dirt');\n        return;\n      }\n    }\n    // 种子\n    if (def && def.placeAs && hit) {\n      const ground = getBlock(hit.id);\n      if (ground.name === 'farmland' && this.world.getBlock(hit.x, hit.y + 1, hit.z) === 0) {\n        this.world.setBlock(hit.x, hit.y + 1, hit.z, ID[def.placeAs]);\n        if (p.gamemode !== 'creative') {\n          held.count--;\n          if (held.count <= 0) p.inventory.set(p.hotbar, null);\n        }\n        this.sound.play('place');\n        this.ui.refresh();\n        return;\n      }\n    }\n    // 放置方块\n    if (def && def.block && hit) {\n      this.placeBlock(hit, def.block);\n    }\n  }\n\n  placeBlock(hit, blockName) {\n    const p = this.player;\n    const now = performance.now();\n    if (now - this.lastPlaceTime < 160) return;\n    const b = BLOCK_BY_NAME.get(blockName);\n    if (!b) return;\n    const target = getBlock(hit.id);\n    let x = hit.x, y = hit.y, z = hit.z;\n    if (!target.replaceable) {\n      x += hit.face[0]; y += hit.face[1]; z += hit.face[2];\n    }\n    if (y < 0 || y >= CHUNK_Y) return;\n    const existing = getBlock(this.world.getBlock(x, y, z));\n    if (!existing.replaceable && existing.id !== 0) return;\n\n    // 不能卡在玩家身体里\n    const boxes = collisionBoxes(b.id);\n    if (boxes) {\n      const pb = p.aabb();\n      for (const [bx, by, bz, bX, bY, bZ] of boxes) {\n        if (pb[3] > x + bx && pb[0] < x + bX &&\n            pb[4] > y + by && pb[1] < y + bY &&\n            pb[5] > z + bz && pb[2] < z + bZ) return;\n      }\n    }\n    // 需要支撑\n    if (b.needsSupport) {\n      const below = getBlock(this.world.getBlock(x, y - 1, z));\n      const wallOk = b.render === RT.LADDER || b.render === RT.TORCH;\n      if (!below.solid && !wallOk) return;\n      if (b.render === RT.LADDER) {\n        const face = faceIndexOf(hit.face);\n        if (face === 2 || face === 3) return;\n        this.world.setBlock(x, y, z, b.id, { meta: face });\n        this.finishPlace(b);\n        return;\n      }\n      if (b.render === RT.TORCH && !below.solid) {\n        // 火把要贴在实心方块上\n        const support = getBlock(this.world.getBlock(hit.x, hit.y, hit.z));\n        if (!support.solid) return;\n      }\n    }\n\n    this.world.setBlock(x, y, z, b.id);\n    if (b.name === 'furnace' || b.name === 'chest') {\n      this.world.getTileEntity(x, y, z, () => this.newTile(b.name));\n      if (b.name === 'furnace') this.activeFurnaces.set(`${x},${y},${z}`, { x, y, z });\n    }\n    this.finishPlace(b);\n  }\n\n  finishPlace(b) {\n    const p = this.player;\n    this.lastPlaceTime = performance.now();\n    if (p.gamemode !== 'creative') {\n      const held = p.heldItem;\n      if (held) {\n        held.count--;\n        if (held.count <= 0) p.inventory.set(p.hotbar, null);\n      }\n    }\n    this.sound.play('place', soundMaterial(b.name));\n    this.ui.refresh();\n  }\n\n  newTile(kind) {\n    if (kind === 'furnace') {\n      return { type: 'furnace', items: [null, null, null], burn: 0, burnTotal: 0, cook: 0 };\n    }\n    return { type: 'chest', items: new Array(27).fill(null) };\n  }\n\n  openChest(x, y, z) {\n    const te = this.world.getTileEntity(x, y, z, () => this.newTile('chest'));\n    const inv = new Inventory(27);\n    inv.load(te.items);\n    this.openTile = { te, inv, x, y, z };\n    this.ui.open('chest', { inv });\n    this.sound.play('door');\n  }\n\n  openFurnace(x, y, z) {\n    const te = this.world.getTileEntity(x, y, z, () => this.newTile('furnace'));\n    const inv = new Inventory(3);\n    inv.load(te.items);\n    this.openTile = { te, inv, x, y, z };\n    this.activeFurnaces.set(`${x},${y},${z}`, { x, y, z });\n    this.ui.open('furnace', { inv, tile: te });\n    this.sound.play('door');\n  }\n\n  syncOpenTile() {\n    if (!this.openTile) return;\n    this.openTile.te.items = this.openTile.inv.serialize();\n  }\n\n  pickBlock() {\n    const hit = this.targetBlock();\n    if (!hit) return;\n    const b = getBlock(hit.id);\n    const name = b.name === 'furnace_lit' ? 'furnace' : b.name;\n    const p = this.player;\n    for (let i = 0; i < 9; i++) {\n      const s = p.inventory.get(i);\n      if (s && s.item === name) { p.hotbar = i; this.onHotbarChange(); return; }\n    }\n    if (p.gamemode === 'creative') {\n      p.inventory.set(p.hotbar, makeStack(name, 1));\n      this.onHotbarChange();\n    }\n  }\n\n  dropHeld(all) {\n    const p = this.player;\n    const s = p.heldItem;\n    if (!s) return;\n    const n = all ? s.count : 1;\n    this.dropItem(s.item, n);\n    s.count -= n;\n    if (s.count <= 0) p.inventory.set(p.hotbar, null);\n    this.ui.refresh();\n  }\n\n  dropItem(item, count) {\n    const p = this.player;\n    const d = this.lookDir();\n    this.entities.spawnItem(p.x + d[0] * 0.6, p.eyeY - 0.3, p.z + d[2] * 0.6, item, count);\n    const it = this.entities.items[this.entities.items.length - 1];\n    if (it) {\n      it.vx = d[0] * 6; it.vy = d[1] * 6 + 1.5; it.vz = d[2] * 6;\n      it.pickupDelay = 1;\n    }\n  }\n\n  // ── 挖掘 ──\n  updateMining(dt) {\n    const p = this.player;\n    if (!this.input.mining || this.ui.screen || p.dead) { p.mining = null; return; }\n    const hit = this.targetBlock();\n    if (!hit) { p.mining = null; return; }\n    const mob = this.targetMob(3.6);\n    if (mob && hit.dist > 3.4) { p.mining = null; return; }\n\n    if (!p.mining || p.mining.x !== hit.x || p.mining.y !== hit.y || p.mining.z !== hit.z) {\n      p.mining = { x: hit.x, y: hit.y, z: hit.z, progress: 0, total: p.breakTime(hit.id), id: hit.id };\n    }\n    const b = getBlock(hit.id);\n    if (p.mining.total === Infinity) return;\n    p.mining.progress += dt;\n    p.swingTime = Math.max(p.swingTime, 0.4);\n\n    this.digSoundTimer = (this.digSoundTimer || 0) - dt;\n    if (this.digSoundTimer <= 0) {\n      this.digSoundTimer = 0.22;\n      this.sound.play('dig', soundMaterial(b.name));\n    }\n\n    if (p.mining.progress >= p.mining.total) {\n      this.breakBlock(hit.x, hit.y, hit.z, hit.id);\n      p.mining = null;\n    }\n  }\n\n  breakBlock(x, y, z, id) {\n    const p = this.player;\n    const b = getBlock(id);\n    if (p.gamemode !== 'creative') {\n      const drops = blockDrops(id, p.toolTier, p.toolType, () => this.rand.next());\n      for (const d of drops) {\n        this.entities.spawnItem(x + 0.5, y + 0.5, z + 0.5, d.item, d.count);\n      }\n      if (b.tool && p.toolType) p.damageTool(1);\n      p.exhaustion += 0.005;\n    }\n    if (b.name === 'furnace' || b.name === 'furnace_lit' || b.name === 'chest') {\n      const te = this.world.getTileEntity(x, y, z);\n      if (te && te.items) {\n        for (const s of te.items) {\n          if (s) this.entities.spawnItem(x + 0.5, y + 0.7, z + 0.5, s[0], s[1]);\n        }\n      }\n      this.activeFurnaces.delete(`${x},${y},${z}`);\n    }\n    this.world.setBlock(x, y, z, 0);\n    this.sound.play('break', soundMaterial(b.name));\n    this.entities.addParticles(x + 0.5, y + 0.5, z + 0.5, 6);\n    // 上方的重力方块要塌\n    for (let dy = 1; dy < 6; dy++) {\n      const above = this.world.getBlock(x, y + dy, z);\n      if (above === 0) break;\n      if (getBlock(above).gravity) this.world.tickGravity(x, y + dy, z);\n      else break;\n    }\n    this.ui.refresh();\n  }\n\n  // ── 熔炉 ──\n  tickFurnaces(dt) {\n    for (const [key, pos] of this.activeFurnaces) {\n      const chunk = this.world.chunkAt(pos.x, pos.z);\n      if (!chunk) { this.activeFurnaces.delete(key); continue; }\n      const te = this.world.getTileEntity(pos.x, pos.y, pos.z);\n      if (!te || te.type !== 'furnace') { this.activeFurnaces.delete(key); continue; }\n\n      const open = this.openTile && this.openTile.te === te;\n      const inv = open ? this.openTile.inv : (() => {\n        const i = new Inventory(3);\n        i.load(te.items);\n        return i;\n      })();\n\n      const input = inv.get(0);\n      const fuel = inv.get(1);\n      const out = inv.get(2);\n      const recipe = input ? SMELTING.get(input.item) : null;\n      const canOutput = recipe && (!out || (out.item === recipe.result && out.count < 64));\n\n      if (te.burn > 0) te.burn -= dt;\n      if (te.burn <= 0 && canOutput && fuel) {\n        const fv = fuelValue(fuel.item);\n        if (fv > 0) {\n          te.burn = fv / 10;\n          te.burnTotal = te.burn;\n          fuel.count--;\n          const container = fuel.item === 'lava_bucket' ? 'bucket' : null;\n          if (fuel.count <= 0) inv.set(1, container ? makeStack(container, 1) : null);\n        }\n      }\n      if (te.burn > 0 && canOutput) {\n        te.cook += dt;\n        if (te.cook >= 10) {\n          te.cook = 0;\n          if (out) out.count += recipe.count;\n          else inv.set(2, makeStack(recipe.result, recipe.count));\n          input.count--;\n          if (input.count <= 0) inv.set(0, null);\n        }\n      } else {\n        te.cook = Math.max(0, te.cook - dt * 2);\n      }\n      if (!open) te.items = inv.serialize();\n\n      // 亮/灭状态切换\n      const cur = this.world.getBlock(pos.x, pos.y, pos.z);\n      const want = te.burn > 0 ? ID.furnace_lit : ID.furnace;\n      if (cur === ID.furnace || cur === ID.furnace_lit) {\n        if (cur !== want) this.world.setBlock(pos.x, pos.y, pos.z, want, { noSupport: true });\n      }\n      if (te.burn <= 0 && !canOutput && !open) this.activeFurnaces.delete(key);\n    }\n    // 刷新熔炉界面进度条\n    if (this.ui.screen === 'furnace' && this.openTile) {\n      const te = this.openTile.te;\n      if (this.ui.smeltArrow) this.ui.smeltArrow.style.width = `${Math.min(100, (te.cook / 10) * 100)}%`;\n      if (this.ui.fireEl) {\n        this.ui.fireEl.style.opacity = te.burn > 0 ? 1 : 0.15;\n        this.ui.fireEl.style.setProperty('--fill', `${te.burnTotal ? (te.burn / te.burnTotal) * 100 : 0}%`);\n      }\n      this.ui.refresh();\n    }\n  }\n\n  // ── 存档 ──\n  save() {\n    try {\n      const chunks = [];\n      for (const c of this.world.chunks.values()) {\n        if (c.modified) chunks.push(c.serialize());\n      }\n      const data = {\n        seed: this.world.seed,\n        time: this.world.time,\n        player: {\n          x: this.player.x, y: this.player.y, z: this.player.z,\n          yaw: this.player.yaw, pitch: this.player.pitch,\n          health: this.player.health, food: this.player.food,\n          gamemode: this.player.gamemode,\n          inventory: this.player.inventory.serialize(),\n          armor: this.player.armor.serialize(),\n          spawn: this.player.spawnPoint,\n        },\n        chunks,\n      };\n      localStorage.setItem(SAVE_KEY, JSON.stringify(data));\n      return true;\n    } catch (err) {\n      console.warn('保存失败', err);\n      this.ui && this.ui.showToast('保存失败：存储空间不足');\n      return false;\n    }\n  }\n\n  loadSave() {\n    try {\n      const raw = localStorage.getItem(SAVE_KEY);\n      return raw ? JSON.parse(raw) : null;\n    } catch {\n      return null;\n    }\n  }\n\n  applySave(save) {\n    const p = this.player;\n    const s = save.player;\n    this.world.time = save.time || 6000;\n    p.x = s.x; p.y = s.y; p.z = s.z;\n    p.yaw = s.yaw; p.pitch = s.pitch;\n    p.health = s.health; p.food = s.food;\n    p.gamemode = s.gamemode || 'survival';\n    p.inventory.load(s.inventory);\n    p.armor.load(s.armor);\n    p.spawnPoint = s.spawn || { x: p.x, z: p.z };\n    for (const cd of save.chunks || []) {\n      const c = ChunkFromSave(cd);\n      this.world.chunks.set(chunkKey(cd.cx, cd.cz), c);\n      c.modified = true;\n      for (const [li, te] of c.tileEntities) {\n        if (te.type === 'furnace') {\n          const y = Math.floor(li / (CHUNK_X * CHUNK_Z));\n          const rest = li % (CHUNK_X * CHUNK_Z);\n          const z = Math.floor(rest / CHUNK_X);\n          const x = rest % CHUNK_X;\n          this.activeFurnaces.set(`${cd.cx * 16 + x},${y},${cd.cz * 16 + z}`,\n            { x: cd.cx * 16 + x, y, z: cd.cz * 16 + z });\n        }\n      }\n    }\n  }\n\n  respawn() {\n    this.player.respawn(this.world);\n    this.ui.hideDeath();\n    this.ui.refresh();\n  }\n\n  // ── 主循环 ──\n  loop() {\n    const now = performance.now();\n    let dt = (now - this.lastTime) / 1000;\n    this.lastTime = now;\n    if (dt > 0.25) dt = 0.25;\n\n    this.update(dt);\n    this.render(dt);\n\n    this.frameTimes.push(dt);\n    if (this.frameTimes.length > 60) this.frameTimes.shift();\n    requestAnimationFrame(() => this.loop());\n  }\n\n  update(dt) {\n    const p = this.player;\n    const w = this.world;\n\n    if (!this.ui.screen && !p.dead) {\n      p.update(dt, this.input);\n    } else {\n      p.update(dt, { forward: 0, strafe: 0, jump: false, sneak: false, sprint: false });\n    }\n    if (p.dead && !this.deathShown) {\n      this.deathShown = true;\n      this.ui.showDeath(p.damageCause);\n      this.sound.play('hurt');\n    }\n    if (!p.dead) this.deathShown = false;\n\n    // 走路脚步声\n    if (p.onGround && Math.hypot(p.vx, p.vz) > 1.2) {\n      this.stepTimer = (this.stepTimer || 0) - dt;\n      if (this.stepTimer <= 0) {\n        this.stepTimer = p.sprinting ? 0.28 : 0.42;\n        const under = w.getBlock(Math.floor(p.x), Math.floor(p.y - 0.2), Math.floor(p.z));\n        this.sound.play('step', soundMaterial(getBlock(under).name));\n      }\n    }\n\n    w.tick(dt);\n    w.update(p.x, p.z, this.renderDistance);\n    this.entities.update(dt, p);\n    this.updateMining(dt);\n    this.tickFurnaces(dt);\n    this.syncOpenTile();\n    this.processMeshQueue(this.meshQueue.length > 40 ? 6 : 3);\n\n    // 标记被修改过的区块（存档用）\n    if (p.mining === null && this.lastSetBlock !== w.tickCount) {\n      // setBlock 已经把 dirty 置位，这里顺带标记 modified\n    }\n\n    // 界面刷新节流\n    this.uiTimer = (this.uiTimer || 0) + dt;\n    if (this.uiTimer > 0.2) {\n      this.uiTimer = 0;\n      this.ui.updateStats();\n    }\n\n    // 受伤 / 水下滤镜\n    if (p.hurtCooldown > 0) this.ui.setFx('hurt', p.hurtCooldown / 0.5);\n    else if (p.inLava) this.ui.setFx('lava', 1);\n    else if (p.headInWater) this.ui.setFx('water', 1);\n    else this.ui.setFx('none', 0);\n\n    // 自动保存\n    this.saveTimer = (this.saveTimer || 0) + dt;\n    if (this.saveTimer > 60) { this.saveTimer = 0; this.save(); }\n  }\n\n  render(dt) {\n    const r = this.renderer;\n    const p = this.player;\n    r.resize();\n    const aspect = this.canvas.width / this.canvas.height;\n\n    // 相机\n    let camX = p.x, camY = p.eyeY, camZ = p.z;\n    const bob = p.onGround ? Math.sin(p.bobPhase) * 0.035 : 0;\n    camY += bob;\n    camX += Math.cos(p.bobPhase) * 0.012;\n    if (this.thirdPerson) {\n      const d = this.lookDir();\n      const back = 4;\n      const hit = this.world.raycast(camX, camY, camZ, -d[0], -d[1], -d[2], back);\n      const dist = hit ? Math.max(0.4, hit.dist - 0.3) : back;\n      camX -= d[0] * dist; camY -= d[1] * dist; camZ -= d[2] * dist;\n    }\n    const camPos = [camX, camY, camZ];\n\n    const fovScale = p.sprinting ? 1.08 : 1;\n    r.beginFrame(camPos, p.yaw, p.pitch, aspect, fovScale);\n\n    const biome = this.world.getBiomeAt(Math.floor(p.x), Math.floor(p.z));\n    const env = r.environment(this.world, camPos, biome);\n    const headBlock = this.world.getBlock(Math.floor(camX), Math.floor(camY), Math.floor(camZ));\n    const underwater = headBlock === ID.water;\n\n    r.clear();\n    r.drawSky(env, camPos, underwater);\n    r.drawChunks(this.world, env, camPos, underwater, this.world.chunks.values());\n\n    // 实体\n    this.entityRenderer.beginEntities(env, camPos);\n    for (const m of this.entities.mobs) {\n      const light = this.lightAtEntity(m.x, m.y + 1, m.z);\n      this.entityRenderer.drawMob(m, performance.now() / 1000, light);\n    }\n    for (const it of this.entities.items) {\n      const def = getItem(it.item);\n      const light = this.lightAtEntity(it.x, it.y, it.z);\n      const t = performance.now() / 1000;\n      const yy = it.y + 0.25 + Math.sin(t * 2 + it.age * 3) * 0.06;\n      if (def && def.block) {\n        const mat = m4.fromTranslation(it.x, yy, it.z);\n        m4.rotateY(mat, t * 1.4, mat);\n        m4.scale(mat, 0.32, 0.32, 0.32, mat);\n        this.entityRenderer.drawBlockCube(def.block, mat, env, camPos, Math.round(light * 15));\n        this.entityRenderer.beginEntities(env, camPos);\n      } else {\n        const idx = this.iconData.index.get(it.item);\n        if (idx !== undefined) {\n          this.entityRenderer.drawItemBillboard(it.x, yy, it.z, idx, this.atlasCols, p.yaw, 0.42, light);\n        }\n      }\n    }\n    for (const a of this.entities.arrows) {\n      const mat = m4.fromTranslation(a.x, a.y, a.z);\n      m4.scale(mat, 0.12, 0.12, 0.12, mat);\n      this.entityRenderer.drawBlockCube('oak_planks', mat, env, camPos, 12);\n      this.entityRenderer.beginEntities(env, camPos);\n    }\n\n    // 选中框\n    if (!this.ui.screen) {\n      const hit = this.targetBlock();\n      if (hit) {\n        const boxes = collisionBoxes(hit.id) || [[0, 0, 0, 1, 1, 1]];\n        r.drawSelection(hit.x, hit.y, hit.z, boxes);\n        if (p.mining && p.mining.total !== Infinity) {\n          const f = Math.min(1, p.mining.progress / p.mining.total);\n          this.drawCrack(hit, f, env, camPos);\n        }\n      }\n    }\n\n    // 手持物品\n    if (!this.thirdPerson) this.drawHeldItem(env, camPos, aspect);\n\n    this.updateDebug(env, biome);\n  }\n\n  lightAtEntity(x, y, z) {\n    const sky = this.world.getSky(Math.floor(x), Math.floor(y), Math.floor(z)) / 15;\n    const blk = this.world.getBlockLight(Math.floor(x), Math.floor(y), Math.floor(z)) / 15;\n    const day = this.world.dayFactor;\n    return Math.max(0.12, Math.max(sky * (0.16 + day * 0.84), blk));\n  }\n\n  drawCrack(hit, f, env, camPos) {\n    // 用一个略大的半透明黑框表示破坏进度\n    const gl = this.renderer.gl;\n    const p = this.renderer.line;\n    gl.useProgram(p.program);\n    gl.uniformMatrix4fv(p.u.uProj, false, this.renderer.proj);\n    gl.uniformMatrix4fv(p.u.uView, false, this.renderer.view);
