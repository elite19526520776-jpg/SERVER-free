密的叶尖 */\nfunction grassLayer(t, base, tip, density = 1, alphaCut = false) {\n  t.each((x, y, u, v) => {\n    const blade = P.tileFbm2(u * 26, v * 26, 26, 3);\n    const clump = P2.tileFbm2(u * 5, v * 5, 5, 3);\n    const streak = P.tileNoise2xy(u * 40, v * 12, 40, 12);\n    const m = clamp(0.5 + blade * 0.9 + clump * 0.5 + streak * 0.25, 0, 1);\n    const c = mix3(base, tip, m);\n    const shade = 1 + (m - 0.5) * 0.28;\n    const a = alphaCut ? (m > 0.5 - 0.42 * density ? 1 : 0) : 1;\n    t.set(x, y, [c[0] * shade, c[1] * shade, c[2] * shade], a);\n    t.setR(x, y, 0.88 - m * 0.12);\n    t.setH(x, y, m * 0.8);\n  });\n}\n\n/**\n * 树皮：纵向纤维 + 深裂纹。\n * 纹理沿 u（水平）方向重复，沿 v（垂直）方向拉长，符合树干的真实走向。\n */\nfunction barkTexture(t, light, dark, opts = {}) {\n  const {\n    cracks = 7, fiberFreq = 26, rough = 0.94, contrast = 1,\n    crackDepth = 1, seed = 2,\n  } = opts;\n  t.each((x, y, u, v) => {\n    // 三层纤维：粗块 → 主纹理 → 细毛刺，纵向拉长\n    const coarse = P2.tileFbm2xy(u * 5 + seed * 2, v * 2, 5, 2, 3);\n    const fiber = P.tileFbm2xy(u * fiberFreq + seed, v * 7, fiberFreq, 7, 4);\n    const micro = P2.tileFbm2xy(u * fiberFreq * 2.2 + seed, v * 16, fiberFreq * 2.2, 16, 2);\n    const dust = (hash01(x, y, seed * 13) - 0.5) * 0.12;\n    let m = clamp(0.5 + coarse * 0.42 + fiber * 0.52 + micro * 0.3 + dust, 0, 1);\n    // 纵向深裂沟\n    const crack = Math.abs(P.tileNoise2xy(u * cracks + seed * 3, v * 1.8, cracks, 1.8));\n    const deep = smoothstep(0.085, 0.0, crack) * crackDepth;\n    const shade = clamp((m * 0.66 + deep * 0.7) * contrast, 0, 1);\n    const c = mix3(light, dark, shade);\n    t.set(x, y, c);\n    t.setR(x, y, rough - m * 0.06);\n    t.setH(x, y, (1 - deep * 0.85) * (0.35 + m * 0.65));\n  });\n}\n\n/** 木板：多块木条拼接，条与条之间有缝 */\nfunction planks(t, light, dark, seed = 1) {\n  const s = t.size;\n  const plankH = s / 4;\n  t.each((x, y, u, v) => {\n    const row = Math.floor(y / plankH);\n    const off = hash01(row, seed) * 10;\n    const local = (y % plankH) / plankH;\n    // 木板纹理沿 x 方向延伸：低频在 u，高频在 v\n    const warp = P.tileFbm2xy(u * 3 + off, v * 6, 3, 6, 3) * 0.32;\n    const fib = P2.tileFbm2xy(u * 5 + off, v * 30, 5, 30, 3) * 0.55;\n    let m = clamp(0.45 + warp * 0.9 + fib * 0.5, 0, 1);\n    let c = mix3(light, dark, m);\n    let h = 1 - m * 0.4;\n    // 木板之间的缝隙\n    const edge = local < 0.055 || local > 0.955;\n    if (edge) {\n      c = mix3(c, [0.05, 0.035, 0.02], 0.62);\n      h = 0.05;\n    }\n    // 竖向断口\n    const segW = s / 2;\n    const segX = (x + Math.floor(hash01(row, seed + 3) * s)) % s;\n    if (segX % segW < 1) {\n      c = mix3(c, [0.06, 0.04, 0.03], 0.55);\n      h = 0.08;\n    }\n    t.set(x, y, c);\n    t.setR(x, y, 0.7 + m * 0.15);\n    t.setH(x, y, h);\n  });\n}\n\n/** 树叶：镂空 + 多层叠影 */\nfunction leaves(t, color, opts = {}) {\n  const { density = 0.62, needle = false, seed = 4 } = opts;\n  t.each((x, y, u, v) => {\n    const n1 = needle\n      ? Math.abs(P.tileNoise2xy(u * 30, v * 9, 30, 9))\n      : P.tileFbm2(u * 12 + seed, v * 12, 12, 3) * 0.5 + 0.5;\n    const n2 = P2.tileFbm2(u * 26, v * 26, 26, 2) * 0.5 + 0.5;\n    const m = n1 * 0.65 + n2 * 0.35;\n    const solid = m > 1 - density;\n    if (!solid) {\n      t.set(x, y, [0, 0, 0], 0);\n      t.setH(x, y, 0);\n      return;\n    }\n    const depth = clamp((m - (1 - density)) / density, 0, 1);\n    const shade = 0.62 + depth * 0.58;\n    const hueShift = (n2 - 0.5) * 0.12;\n    t.set(x, y, [\n      clamp(color[0] * shade + hueShift * 0.3, 0, 1),\n      clamp(color[1] * shade + hueShift, 0, 1),\n      clamp(color[2] * shade, 0, 1),\n    ], 1);\n    t.setR(x, y, 0.8);\n    t.setH(x, y, depth);\n  });\n}\n\n/** 在底材上撒矿脉 */\nfunction oreOverlay(t, oreCol, opts = {}) {\n  const { blobs = 5, size = 0.115, metal = 0.0, rough = 0.4, glow = 0 } = opts;\n  const spots = [];\n  for (let i = 0; i < blobs; i++) {\n    spots.push([hash01(i, 1, opts.seed || 0), hash01(i, 2, opts.seed || 0), size * (0.6 + hash01(i, 3) * 0.8)]);\n  }\n  t.each((x, y, u, v) => {\n    let best = 1e9;\n    for (const [sx, sy, sr] of spots) {\n      let dx = Math.abs(u - sx); dx = Math.min(dx, 1 - dx);\n      let dy = Math.abs(v - sy); dy = Math.min(dy, 1 - dy);\n      const wob = P.tileFbm2(u * 10, v * 10, 10, 3) * 0.035;\n      const d = Math.sqrt(dx * dx + dy * dy) - sr - wob;\n      best = Math.min(best, d);\n    }\n    if (best < 0) {\n      const core = clamp(-best / size, 0, 1);\n      const sparkle = P2.tileFbm2(u * 30, v * 30, 30, 2) * 0.22;\n      const l = 0.72 + core * 0.5 + sparkle;\n      t.set(x, y, [clamp(oreCol[0] * l, 0, 1), clamp(oreCol[1] * l, 0, 1), clamp(oreCol[2] * l, 0, 1)]);\n      t.setR(x, y, rough);\n      t.setM(x, y, metal);\n      t.setH(x, y, 0.55 + core * 0.45);\n    }\n  });\n}\n\n/** 砖块 / 石砖：错缝砌法 */\nfunction brickPattern(t, brick, mortar, opts = {}) {\n  const { rows = 4, cols = 2, mortarW = 0.055, jitter = 0.06, seed = 6 } = opts;\n  t.each((x, y, u, v) => {\n    const ry = v * rows;\n    const row = Math.floor(ry);\n    const fy = ry - row;\n    const shift = row % 2 === 0 ? 0 : 0.5;\n    const rx = (u + shift) * cols;\n    const col = Math.floor(rx);\n    const fx = rx - col;\n    const isMortar = fy < mortarW * rows * 0.5 || fy > 1 - mortarW * rows * 0.5 ||\n                     fx < mortarW * cols * 0.5 || fx > 1 - mortarW * cols * 0.5;\n    if (isMortar) {\n      const g = P.tileFbm2(u * 30, v * 30, 30, 3) * 0.12;\n      t.set(x, y, [mortar[0] + g, mortar[1] + g, mortar[2] + g]);\n      t.setR(x, y, 0.97);\n      t.setH(x, y, 0.12);\n    } else {\n      const tone = (hash01(row, col, seed) - 0.5) * jitter * 2;\n      const grit = P.tileFbm2(u * 22, v * 22, 22, 3) * 0.13\n        + P2.tileFbm2(u * 44, v * 44, 44, 2) * 0.08\n        + (hash01(x, y, seed + 5) - 0.5) * 0.09;\n      const edge = smoothstep(0, 0.12, Math.min(fx, 1 - fx)) * smoothstep(0, 0.16, Math.min(fy, 1 - fy));\n      const l = 1 + tone + grit;\n      const c = [brick[0] * l, brick[1] * l, brick[2] * l];\n      t.set(x, y, mix3([c[0] * 0.7, c[1] * 0.7, c[2] * 0.7], c, edge));\n      t.setR(x, y, 0.9);\n      t.setH(x, y, 0.45 + edge * 0.55);\n    }\n  });\n}\n\n/** 苔藓覆盖（用于苔石、苔石砖） */\nfunction mossOverlay(t, mossCol = hex(0x4f6f34), coverage = 0.5) {\n  t.each((x, y, u, v) => {\n    const m = P.tileFbm2(u * 6 + 31, v * 6, 6, 4) * 0.5 + 0.5;\n    const fine = P2.tileFbm2(u * 22, v * 22, 22, 2) * 0.2;\n    if (m + fine > 1 - coverage) {\n      const k = clamp((m + fine - (1 - coverage)) / coverage, 0, 1);\n      const c = t.get(x, y);\n      const shade = 0.75 + fine * 1.6;\n      t.set(x, y, mix3(c, [mossCol[0] * shade, mossCol[1] * shade, mossCol[2] * shade], k * 0.92));\n      t.setR(x, y, 0.95);\n      t.setH(x, y, t.height[t.idx(x, y)] * 0.6 + k * 0.4);\n    }\n  });\n}\n\n/** 金属/宝石方块：高反射，带斜面 */\nfunction mineralBlock(t, color, opts = {}) {\n  const { metal = 1, rough = 0.22, facets = 4, gem = false } = opts;\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, facets, gem ? 12 : 4);\n    const face = (vor.id % 61) / 61;\n    const edge = smoothstep(0, 0.06, vor.f2 - vor.f1);\n    const grain = P.tileFbm2(u * 20, v * 20, 20, 3) * 0.05;\n    const l = 0.82 + face * 0.34 + grain + (1 - edge) * 0.25;\n    t.set(x, y, [clamp(color[0] * l, 0, 1), clamp(color[1] * l, 0, 1), clamp(color[2] * l, 0, 1)]);\n    t.setR(x, y, clamp(rough + (1 - edge) * 0.25 + grain, 0.05, 1));\n    t.setM(x, y, metal);\n    t.setH(x, y, 0.35 + edge * 0.65);\n  });\n}\n\n/** 十字植物：在透明底上画茎与叶/花 */\nfunction plantCross(t, stemCol, leafCol, flowerCol, opts = {}) {\n  const { height = 0.9, bushy = 0.5, flower = false, flowerSize = 0.1, seed = 8 } = opts;\n  t.fill([0, 0, 0], 0);\n  const s = t.size;\n  const stems = 4 + Math.floor(bushy * 7);\n  for (let i = 0; i < stems; i++) {\n    const baseX = 0.16 + hash01(i, seed) * 0.68;\n    const bend = (hash01(i, seed + 1) - 0.5) * 0.62;\n    const h = height * (0.45 + hash01(i, seed + 2) * 0.55);\n    const thick = 1.1 + hash01(i, seed + 3) * 1.5;\n    const steps = 96;\n    for (let step = 0; step <= steps; step++) {\n      const tt = (step / steps) * h;\n      // 叶片自然弯曲：越靠近尖端偏移越大\n      const px = (baseX + bend * tt * tt) * s;\n      const py = (1 - tt) * s;\n      // 尖端收细\n      const w = Math.max(0, thick * (1 - Math.pow(tt / Math.max(h, 0.01), 1.6)));\n      const shade = 0.6 + tt * 0.62 + hash01(i, step) * 0.1;\n      const c = mix3(stemCol, leafCol, clamp(tt / Math.max(h, 0.01), 0, 1));\n      const iw = Math.ceil(w);\n      for (let dx = -iw; dx <= iw; dx++) {\n        if (Math.abs(dx) > w) continue;\n        const xx = Math.round(px + dx), yy = Math.round(py);\n        if (xx < 0 || xx >= s || yy < 0 || yy >= s) continue;\n        // 叶片中脉略亮，边缘略暗\n        const rib = 1 - Math.abs(dx) / (w + 0.6) * 0.3;\n        t.set(xx, yy, [c[0] * shade * rib, c[1] * shade * rib, c[2] * shade * rib], 1);\n        t.setR(xx, yy, 0.85);\n        t.setH(xx, yy, 0.55 + rib * 0.45);\n      }\n    }\n    if (flower && i < 3) {\n      const fx = (baseX + bend * h * h) * s;\n      const fy = (1 - h) * s;\n      const r = flowerSize * s;\n      for (let dy = -r; dy <= r; dy++) {\n        for (let dx = -r; dx <= r; dx++) {\n          const d = Math.sqrt(dx * dx + dy * dy);\n          if (d > r) continue;\n          const xx = Math.round(fx + dx), yy = Math.round(fy + dy);\n          if (xx < 0 || xx >= s || yy < 0 || yy >= s) continue;\n          const petal = Math.abs(Math.sin(Math.atan2(dy, dx) * 3)) * 0.35 + 0.75;\n          const c = d < r * 0.32 ? [0.95, 0.85, 0.35] : flowerCol;\n          t.set(xx, yy, [clamp(c[0] * petal, 0, 1), clamp(c[1] * petal, 0, 1), clamp(c[2] * petal, 0, 1)], 1);\n          t.setR(xx, yy, 0.7);\n          t.setH(xx, yy, 0.9);\n        }\n      }\n    }\n  }\n}\n\n// ── 材质注册表 ─────────────────────────────────────────────────\n\n/** name → generator，按注册顺序决定纹理数组的层号 */\nexport const TEXTURES = {};\nfunction def(name, gen) {\n  TEXTURES[name] = gen;\n}\n\n// 石材\ndef('stone', (t) => rockBase(t, hex(0x7d7d7d), { cells: 14, seed: 1 }));\ndef('granite', (t) => rockBase(t, hex(0x9a6b5b), { cells: 9, cellStrength: 0.13, blotch: 0.12, seed: 2 }));\ndef('diorite', (t) => rockBase(t, hex(0xc6c6c8), { cells: 9, cellStrength: 0.09, blotch: 0.08, speckle: 0.13, seed: 3 }));\ndef('andesite', (t) => rockBase(t, hex(0x888a88), { cells: 12, cellStrength: 0.1, seed: 4 }));\ndef('deepslate', (t) => rockBase(t, hex(0x4b4b50), { cells: 16, grain: 0.13, seed: 21 }));\ndef('bedrock', (t) => {\n  rockBase(t, hex(0x4a4a4e), { cells: 7, cellStrength: 0.34, grain: 0.2, blotch: 0.26, speckle: 0.16, seed: 5 });\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 9 + 13, v * 9, 9, 4) * 0.5 + 0.5;\n    const c = t.get(x, y);\n    // 大块明暗交错，边界柔和\n    const k = smoothstep(0.42, 0.62, n);\n    t.set(x, y, mix3([c[0] * 0.42, c[1] * 0.42, c[2] * 0.46], [c[0] * 1.35, c[1] * 1.35, c[2] * 1.3], k));\n  });\n  t.heightFromLuma();\n});\ndef('cobblestone', (t) => {\n  t.fill(hex(0x4c4c4c));\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 5, 11);\n    const rockShade = 0.55 + ((vor.id % 53) / 53) * 0.55;\n    const bevel = smoothstep(0, 0.075, vor.f2 - vor.f1);\n    const grit = P.tileFbm2(u * 24, v * 24, 24, 3) * 0.1;\n    const base = hex(0x7f7f7f);\n    const l = rockShade * (0.55 + bevel * 0.65) + grit;\n    t.set(x, y, [base[0] * l, base[1] * l, base[2] * l]);\n    t.setR(x, y, 0.93);\n    t.setH(x, y, bevel * 0.9 + 0.05);\n  });\n});\ndef('mossy_cobblestone', (t) => {\n  TEXTURES.cobblestone(t);\n  mossOverlay(t, hex(0x4c6b32), 0.55);\n});\ndef('stone_bricks', (t) => brickPattern(t, hex(0x7a7a7a), hex(0x4a4a4a), { rows: 2, cols: 2, mortarW: 0.05, jitter: 0.1, seed: 12 }));\ndef('mossy_stone_bricks', (t) => {\n  TEXTURES.stone_bricks(t);\n  mossOverlay(t, hex(0x4c6b32), 0.5);\n});\ndef('bricks', (t) => brickPattern(t, hex(0x96513a), hex(0xb0aca6), { rows: 4, cols: 2, mortarW: 0.05, jitter: 0.13, seed: 7 }));\ndef('obsidian', (t) => {\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 6, 33);\n    const facet = (vor.id % 41) / 41;\n    const edge = smoothstep(0, 0.05, vor.f2 - vor.f1);\n    const sheen = P.tileFbm2(u * 12, v * 12, 12, 3) * 0.1;\n    const base = mix3(hex(0x0d0b17), hex(0x241d3a), facet * 0.8 + sheen + (1 - edge) * 0.5);\n    t.set(x, y, base);\n    t.setR(x, y, 0.18 + facet * 0.1);\n    t.setM(x, y, 0.25);\n    t.setH(x, y, edge * 0.8 + 0.1);\n  });\n});\n\n// 土壤\ndef('dirt', (t) => soilBase(t, hex(0x866043)));\ndef('coarse_dirt', (t) => soilBase(t, hex(0x77563b), { pebbles: 0.6 }));\ndef('dirt_path_top', (t) => {\n  soilBase(t, hex(0x94794a), { pebbles: 0.45 });\n  // 被踩实的路面：局部压平、少量车辙\n  t.each((x, y, u, v) => {\n    const packed = P.tileFbm2(u * 5 + 21, v * 5, 5, 3) * 0.5 + 0.5;\n    const c = t.get(x, y);\n    const l = 0.92 + packed * 0.2;\n    t.set(x, y, [c[0] * l, c[1] * l, c[2] * l]);\n    t.setH(x, y, t.height[t.idx(x, y)] * 0.6);\n  });\n});\n// 草类贴图使用近似灰度的底色，实际颜色由生物群系染色决定（与原版一致）\ndef('grass_top', (t) => grassLayer(t, hex(0x7d8f74), hex(0xbfcbb0)));\ndef('grass_side', (t) => soilBase(t, hex(0x866043)));\ndef('grass_side_overlay', (t) => {\n  // 只有顶部草皮部分不透明，其余镂空，叠加在泥土侧面之上并接受染色\n  t.fill([0, 0, 0], 0);\n  t.each((x, y, u, v) => {\n    const edge = 0.16 + P.tileNoise2xy(u * 8, 3.3, 8, 8) * 0.16 + P2.tileNoise2xy(u * 20, 1.1, 20, 20) * 0.06;\n    if (v < edge) {\n      const m = clamp(0.5 + P.tileFbm2(u * 26, v * 26, 26, 3) * 0.9, 0, 1);\n      const c = mix3(hex(0x6f8168), hex(0xc2cfb2), m);\n      t.set(x, y, c, 1);\n      t.setR(x, y, 0.88);\n      t.setH(x, y, 0.65 + m * 0.3);\n    }\n  });\n});\ndef('podzol_top', (t) => {\n  soilBase(t, hex(0x5b3f22), { pebbles: 0.1 });\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 9, v * 9, 9, 4) * 0.5 + 0.5;\n    if (n > 0.52) {\n      const c = t.get(x, y);\n      t.set(x, y, mix3(c, hex(0xc07b2e), (n - 0.52) * 2.4));\n    }\n  });\n  t.heightFromLuma();\n});\ndef('podzol_side', (t) => {\n  soilBase(t, hex(0x866043));\n  t.each((x, y, u, v) => {\n    const edge = 0.18 + P.tileNoise2xy(u * 7, 2.1, 7, 7) * 0.12;\n    if (v < edge) t.set(x, y, mix3(hex(0x5b3f22), hex(0xa9691f), P.tileFbm2(u * 14, v * 14, 14, 3) * 0.5 + 0.5));\n  });\n  t.heightFromLuma();\n});\ndef('mycelium_top', (t) => {\n  soilBase(t, hex(0x6f6272), { pebbles: 0.05 });\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 13, v * 13, 13, 4) * 0.5 + 0.5;\n    if (n > 0.55) t.set(x, y, mix3(t.get(x, y), hex(0x9c8ba0), (n - 0.55) * 2.2));\n  });\n  t.heightFromLuma();\n});\ndef('mycelium_side', (t) => {\n  soilBase(t, hex(0x866043));\n  t.each((x, y, u, v) => {\n    const edge = 0.17 + P.tileNoise2xy(u * 7, 5.1, 7, 7) * 0.12;\n    if (v < edge) t.set(x, y, mix3(hex(0x6f6272), hex(0x9c8ba0), P.tileFbm2(u * 12, v * 12, 12, 3) * 0.5 + 0.5));\n  });\n  t.heightFromLuma();\n});\ndef('farmland', (t) => {\n  soilBase(t, hex(0x6b4a2b), { pebbles: 0.2 });\n  t.each((x, y, u, v) => {\n    const furrow = Math.sin(v * Math.PI * 4) * 0.5 + 0.5;\n    const c = t.get(x, y);\n    const l = 0.78 + furrow * 0.34;\n    t.set(x, y, [c[0] * l, c[1] * l, c[2] * l]);\n    t.setH(x, y, furrow);\n  });\n});\ndef('farmland_wet', (t) => {\n  TEXTURES.farmland(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [c[0] * 0.72, c[1] * 0.6, c[2] * 0.5]);\n    t.setR(x, y, 0.35);\n  });\n});\n\n// 沙 / 砾石 / 黏土\ndef('sand', (t) => {\n  t.each((x, y, u, v) => {\n    const dune = P.tileFbm2(u * 6, v * 6, 6, 3) * 0.085;\n    const grain = P2.tileFbm2(u * 30, v * 30, 30, 3) * 0.115;\n    const sparkle = hash01(x, y, 5) > 0.992 ? 0.12 : 0;\n    const base = hex(0xdbcd97);\n    const l = 1 + dune + grain + sparkle;\n    t.set(x, y, [clamp(base[0] * l, 0, 1), clamp(base[1] * l, 0, 1), clamp(base[2] * l, 0, 1)]);\n    t.setR(x, y, 0.96 - sparkle);\n    t.setH(x, y, 0.5 + grain * 2.2 + dune * 2.4);\n  });\n});\ndef('red_sand', (t) => {\n  TEXTURES.sand(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [clamp(c[0] * 1.1, 0, 1), c[1] * 0.62, c[2] * 0.42]);\n  });\n});\ndef('gravel', (t) => {\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 9, 21);\n    const stone = (vor.id % 71) / 71;\n    const bevel = smoothstep(0, 0.05, vor.f2 - vor.f1);\n    const tint = stone < 0.25 ? hex(0x6d6d6d) : stone < 0.6 ? hex(0x8a8175) : hex(0x9d9d9d);\n    const grit = P.tileFbm2(u * 26, v * 26, 26, 3) * 0.11;\n    const l = 0.6 + bevel * 0.6 + grit;\n    t.set(x, y, [tint[0] * l, tint[1] * l, tint[2] * l]);\n    t.setR(x, y, 0.94);\n    t.setH(x, y, bevel);\n  });\n});\ndef('clay', (t) => {\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 10, v * 10, 10, 4) * 0.09;\n    const base = hex(0xa4a8b8);\n    t.set(x, y, [base[0] + n, base[1] + n, base[2] + n]);\n    t.setR(x, y, 0.62);\n    t.setH(x, y, 0.5 + n * 3);\n  });\n});\ndef('sandstone_top', (t) => {\n  TEXTURES.sand(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [c[0] * 0.97, c[1] * 0.97, c[2] * 0.95]);\n    t.setR(x, y, 0.9);\n  });\n});\ndef('sandstone_side', (t) => {\n  t.each((x, y, u, v) => {\n    const strata = Math.sin(v * Math.PI * 9 + P.tileFbm2(u * 3, v * 3, 3, 2) * 3) * 0.5 + 0.5;\n    const grain = P2.tileFbm2(u * 26, v * 26, 26, 3) * 0.1;\n    const base = mix3(hex(0xd6c79a), hex(0xc4b183), strata);\n    const l = 1 + grain;\n    t.set(x, y, [clamp(base[0] * l, 0, 1), clamp(base[1] * l, 0, 1), clamp(base[2] * l, 0, 1)]);\n    t.setR(x, y, 0.93);\n    t.setH(x, y, strata * 0.6 + grain * 2);\n  });\n});\ndef('red_sandstone_top', (t) => {\n  TEXTURES.red_sand(t);\n});\ndef('red_sandstone_side', (t) => {\n  TEXTURES.sandstone_side(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [clamp(c[0] * 1.08, 0, 1), c[1] * 0.58, c[2] * 0.36]);\n  });\n});\n\n// 矿石\nfunction ore(name, col, opts) {\n  def(name, (t) => {\n    TEXTURES.stone(t);\n    oreOverlay(t, col, opts);\n  });\n}\nore('coal_ore', hex(0x1a1a1a), { blobs: 5, size: 0.12, rough: 0.85, seed: 1 });\nore('iron_ore', hex(0xd8a882), { blobs: 5, size: 0.11, metal: 0.7, rough: 0.42, seed: 2 });\nore('copper_ore', hex(0xd07b4a), { blobs: 5, size: 0.115, metal: 0.7, rough: 0.4, seed: 8 });\nore('gold_ore', hex(0xfcdc5f), { blobs: 4, size: 0.11, metal: 0.95, rough: 0.25, seed: 3 });\nore('redstone_ore', hex(0xd11a1a), { blobs: 6, size: 0.1, rough: 0.45, seed: 4 });\nore('lapis_ore', hex(0x2350c8), { blobs: 5, size: 0.11, rough: 0.35, seed: 5 });\nore('diamond_ore', hex(0x5decdb), { blobs: 4, size: 0.115, rough: 0.14, seed: 6 });\nore('emerald_ore', hex(0x2fd05a), { blobs: 3, size: 0.11, rough: 0.16, seed: 7 });\n\n// 原木 / 木板\nconst WOODS = {\n  oak: { bark: [hex(0x6b5231), hex(0x3c2c17)], core: hex(0xb08a55), plank: [hex(0xba8f56), hex(0x8a6636)] },\n  birch: { bark: [hex(0xe6e2d6), hex(0xa8a596)], core: hex(0xd7c9a1), plank: [hex(0xe0d4ab), hex(0xbcae83)] },\n  spruce: { bark: [hex(0x4a3620), hex(0x241a0d)], core: hex(0x7a5a34), plank: [hex(0x866239), hex(0x5b421f)] },\n  jungle: { bark: [hex(0x6f5637), hex(0x3d2f1c)], core: hex(0xa9744f), plank: [hex(0xb1805a), hex(0x845a3a)] },\n  acacia: { bark: [hex(0x6b6152), hex(0x35302a)], core: hex(0xba6337), plank: [hex(0xc06740), hex(0x8c4526)] },\n  dark_oak: { bark: [hex(0x3f2d17), hex(0x1e1409)], core: hex(0x6b4a26), plank: [hex(0x53381d), hex(0x341f0d)] },\n};\nfor (const [w, cfg] of Object.entries(WOODS)) {\n  const barkOpts = {\n    oak: { cracks: 9, fiberFreq: 26, contrast: 1.0, crackDepth: 1.0 },\n    birch: { cracks: 4, fiberFreq: 34, contrast: 0.5, crackDepth: 0.18 },\n    spruce: { cracks: 11, fiberFreq: 22, contrast: 1.15, crackDepth: 1.15 },\n    jungle: { cracks: 8, fiberFreq: 28, contrast: 0.95, crackDepth: 0.9 },\n    acacia: { cracks: 7, fiberFreq: 24, contrast: 1.0, crackDepth: 0.85 },\n    dark_oak: { cracks: 12, fiberFreq: 24, contrast: 1.2, crackDepth: 1.2 },\n  }[w];\n  def(`${w}_log_side`, (t) => {\n    barkTexture(t, cfg.bark[0], cfg.bark[1], { ...barkOpts, seed: w.length + 1 });\n    if (w === 'birch') {\n      // 白桦特有的横向皮孔：细而短的深色横道，随机分布\n      const marks = [];\n      for (let i = 0; i < 9; i++) {\n        marks.push({\n          u: hash01(i, 71),\n          v: hash01(i, 73),\n          len: 0.05 + hash01(i, 77) * 0.11,\n          h: 0.012 + hash01(i, 79) * 0.018,\n          dark: 0.55 + hash01(i, 83) * 0.4,\n        });\n      }\n      t.each((x, y, u, v) => {\n        for (const m of marks) {\n          let du = Math.abs(u - m.u); du = Math.min(du, 1 - du);\n          let dv = Math.abs(v - m.v); dv = Math.min(dv, 1 - dv);\n          if (du < m.len && dv < m.h) {\n            const k = (1 - du / m.len) * (1 - dv / m.h);\n            if (k > 0.12) {\n              t.set(x, y, mix3(t.get(x, y), [0.12, 0.11, 0.09], m.dark * clamp(k * 2.2, 0, 1)));\n              t.setH(x, y, 0.25);\n            }\n          }\n        }\n      });\n    }\n  });\n  def(`${w}_log_top`, (t) => {\n    t.each((x, y, u, v) => {\n      const dx = u - 0.5, dy = v - 0.5;\n      const r = Math.sqrt(dx * dx + dy * dy);\n      const wob = P.tileFbm2(u * 6, v * 6, 6, 3) * 0.06;\n      const ring = Math.sin((r + wob) * 58) * 0.5 + 0.5;\n      let c = mix3(cfg.core, [cfg.core[0] * 0.62, cfg.core[1] * 0.6, cfg.core[2] * 0.55], ring * 0.85);\n      if (r > 0.44) c = mix3(cfg.bark[0], cfg.bark[1], 0.5);\n      t.set(x, y, c);\n      t.setR(x, y, 0.78);\n      t.setH(x, y, 1 - ring * 0.5);\n    });\n  });\n  def(`${w}_planks`, (t) => planks(t, cfg.plank[0], cfg.plank[1], w.length * 7));\n}\n\n// 树叶：橡木/丛林/金合欢/深色橡木用中性底色接受群系染色，白桦与云杉保持固有色\ndef('oak_leaves', (t) => leaves(t, hex(0x9aa87c), { density: 0.66, seed: 1 }));\ndef('birch_leaves', (t) => leaves(t, hex(0x77a544), { density: 0.62, seed: 2 }));\ndef('spruce_leaves', (t) => leaves(t, hex(0x3f6b3f), { density: 0.7, needle: true, seed: 3 }));\ndef('jungle_leaves', (t) => leaves(t, hex(0x94a878), { density: 0.78, seed: 4 }));\ndef('acacia_leaves', (t) => leaves(t, hex(0xa0ac7c), { density: 0.6, seed: 5 }));\ndef('dark_oak_leaves', (t) => leaves(t, hex(0x8e9c72), { density: 0.72, seed: 6 }));\n\n// 液体与冰雪\ndef('water', (t) => {\n  t.each((x, y, u, v) => {\n    const w1 = P.tileFbm2(u * 5, v * 5, 5, 3);\n    const w2 = P2.tileFbm2(u * 11, v * 11, 11, 2);\n    const c = mix3(hex(0x1a4f8f), hex(0x2f7ec4), clamp(0.5 + w1 * 0.9 + w2 * 0.4, 0, 1));\n    t.set(x, y, c, 0.78);\n    t.setR(x, y, 0.04);\n    t.setH(x, y, 0.5 + w1 * 0.5 + w2 * 0.25);\n  });\n});\ndef('lava', (t) => {\n  t.each((x, y, u, v) => {\n    const flow = P.tileFbm2(u * 4, v * 4, 4, 4);\n    const crust = P2.tileFbm2(u * 9, v * 9, 9, 3);\n    const heat = clamp(0.5 + flow * 1.2 + crust * 0.5, 0, 1);\n    let c;\n    if (heat > 0.62) c = mix3(hex(0xff9d1f), hex(0xfff3a0), (heat - 0.62) / 0.38);\n    else c = mix3(hex(0x5a1200), hex(0xe04a05), heat / 0.62);\n    t.set(x, y, c);\n    t.setR(x, y, 0.75);\n    t.setH(x, y, heat);\n  });\n});\ndef('snow', (t) => {\n  t.each((x, y, u, v) => {\n    const drift = P.tileFbm2(u * 7, v * 7, 7, 3) * 0.045;\n    const sparkle = hash01(x, y, 11) > 0.978 ? 0.35 : 0;\n    const c = [clamp(0.94 + drift + sparkle, 0, 1), clamp(0.96 + drift + sparkle, 0, 1), clamp(1.0 + drift, 0, 1)];\n    t.set(x, y, c);\n    t.setR(x, y, 0.62 - sparkle * 0.5);\n    t.setH(x, y, 0.5 + drift * 6);\n  });\n});\ndef('ice', (t) => {\n  t.each((x, y, u, v) => {\n    const crack = voronoiTile(u, v, 5, 71);\n    const edge = smoothstep(0, 0.035, crack.f2 - crack.f1);\n    const c = mix3(hex(0x9fd0ff), hex(0xd6ecff), edge);\n    t.set(x, y, c, 0.72);\n    t.setR(x, y, 0.08);\n    t.setH(x, y, edge);\n  });\n});\ndef('packed_ice', (t) => {\n  TEXTURES.ice(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [c[0] * 0.9, c[1] * 0.95, c[2], 1], 1);\n    t.setR(x, y, 0.2);\n  });\n});\ndef('glass', (t) => {\n  t.each((x, y, u, v) => {\n    const border = u < 0.045 || u > 0.955 || v < 0.045 || v > 0.955;\n    const smudge = P.tileFbm2(u * 8, v * 8, 8, 3) * 0.05;\n    if (border) {\n      t.set(x, y, [0.72, 0.82, 0.86], 0.55);\n      t.setH(x, y, 0.9);\n    } else {\n      t.set(x, y, [0.86 + smudge, 0.93 + smudge, 0.97], 0.14);\n      t.setH(x, y, 0.5);\n    }\n    t.setR(x, y, 0.03);\n  });\n});\ndef('glowstone', (t) => {\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 7, 44);\n    const core = smoothstep(0.14, 0, vor.f1);\n    const c = mix3(hex(0x8a6a3a), hex(0xfff2b0), core);\n    t.set(x, y, c);\n    t.setR(x, y, 0.5);\n    t.setH(x, y, core);\n  });\n});\ndef('sea_lantern', (t) => {\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 4, 91);\n    const edge = smoothstep(0, 0.06, vor.f2 - vor.f1);\n    const c = mix3(hex(0x7fb0a8), hex(0xdcf5ee), edge);\n    t.set(x, y, c);\n    t.setR(x, y, 0.25);\n    t.setH(x, y, edge);\n  });\n});\n\n// 功能方块\ndef('crafting_table_top', (t) => {\n  planks(t, hex(0xba8f56), hex(0x8a6636), 3);\n  t.each((x, y, u, v) => {\n    const gx = Math.floor(u * 3), gy = Math.floor(v * 3);\n    const fx = u * 3 - gx, fy = v * 3 - gy;\n    if (fx < 0.08 || fx > 0.92 || fy < 0.08 || fy > 0.92) {\n      t.set(x, y, mix3(t.get(x, y), [0.15, 0.1, 0.06], 0.7));\n      t.setH(x, y, 0.1);\n    } else {\n      t.set(x, y, mix3(t.get(x, y), hex(0x6b4b26), 0.35));\n    }\n  });\n});\ndef('crafting_table_side', (t) => {\n  planks(t, hex(0xa87d47), hex(0x77552b), 4);\n  t.each((x, y, u, v) => {\n    if (v > 0.55 && v < 0.9 && u > 0.12 && u < 0.88) {\n      t.set(x, y, mix3(t.get(x, y), hex(0x4a3418), 0.55));\n      t.setH(x, y, 0.25);\n    }\n  });\n});\ndef('crafting_table_front', (t) => {\n  planks(t, hex(0xa87d47), hex(0x77552b), 5);\n  t.each((x, y, u, v) => {\n    if (v > 0.3 && v < 0.85 && u > 0.15 && u < 0.85) {\n      const saw = Math.abs(u - 0.5) < 0.06 || Math.abs(v - 0.55) < 0.05;\n      t.set(x, y, mix3(t.get(x, y), saw ? hex(0x8b8b8b) : hex(0x50381b), 0.6));\n    }\n  });\n});\ndef('furnace_top', (t) => rockBase(t, hex(0x6e6e6e), { cells: 12, seed: 41 }));\ndef('furnace_side', (t) => {\n  TEXTURES.cobblestone(t);\n  t.each((x, y) => {\n    const c = t.get(x, y);\n    t.set(x, y, [c[0] * 0.92, c[1] * 0.92, c[2] * 0.94]);\n  });\n});\ndef('furnace_front', (t) => {\n  TEXTURES.furnace_side(t);\n  t.each((x, y, u, v) => {\n    if (v > 0.3 && v < 0.85 && u > 0.15 && u < 0.85) {\n      const frame = v < 0.36 || v > 0.79 || u < 0.21 || u > 0.79;\n      t.set(x, y, frame ? hex(0x3a3a3a) : hex(0x1a1a1a));\n      t.setR(x, y, 0.7);\n      t.setH(x, y, frame ? 0.6 : 0.1);\n    }\n  });\n});\ndef('furnace_front_lit', (t) => {\n  TEXTURES.furnace_side(t);\n  t.each((x, y, u, v) => {\n    if (v > 0.3 && v < 0.85 && u > 0.15 && u < 0.85) {\n      const frame = v < 0.36 || v > 0.79 || u < 0.21 || u > 0.79;\n      if (frame) {\n        t.set(x, y, hex(0x3a3a3a));\n        t.setH(x, y, 0.6);\n      } else {\n        const flame = P.tileFbm2(u * 12, v * 12, 12, 3) * 0.5 + 0.5;\n        t.set(x, y, mix3(hex(0xc23a06), hex(0xffe07a), flame));\n        t.setH(x, y, flame);\n      }\n      t.setR(x, y, 0.6);\n    }\n  });\n});\ndef('chest_top', (t) => planks(t, hex(0xa9773d), hex(0x74501f), 9));\ndef('chest_side', (t) => {\n  planks(t, hex(0xa9773d), hex(0x74501f), 10);\n  t.each((x, y, u, v) => {\n    if (Math.abs(v - 0.36) < 0.035) {\n      t.set(x, y, [0.16, 0.11, 0.05]);\n      t.setH(x, y, 0.1);\n    }\n  });\n});\ndef('chest_front', (t) => {\n  TEXTURES.chest_side(t);\n  t.each((x, y, u, v) => {\n    if (Math.abs(u - 0.5) < 0.09 && v > 0.28 && v < 0.52) {\n      t.set(x, y, mix3(hex(0x6b5a2c), hex(0xd8bf6a), 0.6));\n      t.setR(x, y, 0.28);\n      t.setM(x, y, 0.85);\n      t.setH(x, y, 0.95);\n    }\n  });\n});\ndef('bookshelf', (t) => {\n  planks(t, hex(0xba8f56), hex(0x8a6636), 12);\n  const books = [hex(0xa53b3b), hex(0x3b62a5), hex(0x3ba55c), hex(0xa5993b), hex(0x7a3ba5), hex(0xb06a2c)];\n  t.each((x, y, u, v) => {\n    const shelf = v > 0.16 && v < 0.46 || v > 0.54 && v < 0.84;\n    if (!shelf) return;\n    const bi = Math.floor(u * 9);\n    const fx = u * 9 - bi;\n    const c = books[Math.floor(hash01(bi, v > 0.5 ? 1 : 0) * books.length)];\n    const shade = fx < 0.1 || fx > 0.9 ? 0.5 : 0.85 + hash01(bi, 3) * 0.35;\n    const top = Math.abs(v - (v > 0.5 ? 0.55 : 0.17)) < 0.03 ? 0.6 : 1;\n    t.set(x, y, [c[0] * shade * top, c[1] * shade * top, c[2] * shade * top]);\n    t.setR(x, y, 0.8);\n    t.setH(x, y, shade);\n  });\n});\ndef('tnt_top', (t) => {\n  t.fill(hex(0xd23a2a));\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 20, v * 20, 20, 3) * 0.1;\n    t.set(x, y, [0.82 + n, 0.24 + n, 0.18 + n]);\n    const dx = u - 0.5, dy = v - 0.5;\n    if (dx * dx + dy * dy < 0.02) t.set(x, y, [0.15, 0.13, 0.12]);\n    t.setR(x, y, 0.8);\n  });\n  t.heightFromLuma();\n});\ndef('tnt_side', (t) => {\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 20, v * 20, 20, 3) * 0.09;\n    if (v > 0.34 && v < 0.66) {\n      t.set(x, y, [0.92 + n, 0.9 + n, 0.86 + n]);\n      if (v > 0.42 && v < 0.58 && Math.abs(u - 0.5) < 0.28) t.set(x, y, [0.12, 0.1, 0.1]);\n    } else {\n      t.set(x, y, [0.8 + n, 0.22 + n, 0.17 + n]);\n    }\n    t.setR(x, y, 0.82);\n  });\n  t.heightFromLuma();\n});\ndef('tnt_bottom', (t) => {\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 20, v * 20, 20, 3) * 0.09;\n    t.set(x, y, [0.62 + n, 0.18 + n, 0.14 + n]);\n    t.setR(x, y, 0.85);\n  });\n  t.heightFromLuma();\n});\ndef('hay_top', (t) => {\n  t.each((x, y, u, v) => {\n    const dx = u - 0.5, dy = v - 0.5;\n    const r = Math.sqrt(dx * dx + dy * dy);\n    const ring = Math.sin(r * 40) * 0.5 + 0.5;\n    const c = mix3(hex(0xb8961f), hex(0xe6c74e), ring);\n    t.set(x, y, c);\n    t.setR(x, y, 0.9);\n    t.setH(x, y, ring);\n  });\n});\ndef('hay_side', (t) => {\n  t.each((x, y, u, v) => {\n    const straw = P.tileFbm2xy(u * 5, v * 34, 5, 34, 2) * 0.5 + 0.5;\n    const c = mix3(hex(0xa4831a), hex(0xe8cc5c), straw);\n    t.set(x, y, c);\n    t.setR(x, y, 0.92);\n    t.setH(x, y, straw);\n  });\n});\ndef('sponge', (t) => {\n  t.each((x, y, u, v) => {\n    const vor = voronoiTile(u, v, 10, 63);\n    const hole = smoothstep(0.03, 0.075, vor.f1);\n    const c = mix3(hex(0x9a8a24), hex(0xd8cb52), hole);\n    t.set(x, y, c);\n    t.setR(x, y, 0.95);\n    t.setH(x, y, hole);\n  });\n});\ndef('ladder', (t) => {\n  t.fill([0, 0, 0], 0);\n  const rails = [[0.1, 0.24], [0.76, 0.9]];\n  t.each((x, y, u, v) => {\n    const onRail = rails.some(([a, b]) => u >= a && u <= b);\n    const onRung = (v * 4) % 1 < 0.16;\n    if (onRail || (onRung && u > 0.1 && u < 0.9)) {\n      const g = P.tileFbm2(u * 20, v * 20, 20, 3) * 0.12;\n      t.set(x, y, [0.55 + g, 0.4 + g, 0.2 + g], 1);\n      t.setR(x, y, 0.85);\n      t.setH(x, y, 0.8);\n    }\n  });\n});\ndef('torch', (t) => {\n  t.fill([0, 0, 0], 0);\n  t.each((x, y, u, v) => {\n    const inStick = Math.abs(u - 0.5) < 0.09 && v > 0.34;\n    const inHead = Math.abs(u - 0.5) < 0.13 && v > 0.18 && v <= 0.36;\n    if (inStick) {\n      const g = P.tileFbm2(u * 20, v * 20, 20, 2) * 0.12;\n      t.set(x, y, [0.48 + g, 0.34 + g, 0.16 + g], 1);\n      t.setR(x, y, 0.85);\n      t.setH(x, y, 0.7);\n    } else if (inHead) {\n      const f = P.tileFbm2(u * 14, v * 14, 14, 3) * 0.5 + 0.5;\n      t.set(x, y, mix3(hex(0xff8a1a), hex(0xfff3b0), f), 1);\n      t.setR(x, y, 0.4);\n      t.setH(x, y, 1);\n    }\n  });\n});\n\n// 羊毛与陶瓦（参数化生成 16 色）\nexport const DYE_COLORS = {\n  white: 0xe9ecec, orange: 0xf07613, magenta: 0xbd44b3, light_blue: 0x3aafd9,\n  yellow: 0xf8c527, lime: 0x70b919, pink: 0xed8dac, gray: 0x3e4447,\n  light_gray: 0x8e8e86, cyan: 0x158991, purple: 0x792aac, blue: 0x35399d,\n  brown: 0x724728, green: 0x546d1b, red: 0xa12722, black: 0x141519,\n};\nfor (const [name, c] of Object.entries(DYE_COLORS)) {\n  def(`${name}_wool`, (t) => {\n    const col = hex(c);\n    t.each((x, y, u, v) => {\n      const fiber = P.tileFbm2(u * 22, v * 22, 22, 4);\n      const curl = P2.tileFbm2(u * 9, v * 9, 9, 3);\n      const l = 1 + fiber * 0.22 + curl * 0.12;\n      t.set(x, y, [clamp(col[0] * l, 0, 1), clamp(col[1] * l, 0, 1), clamp(col[2] * l, 0, 1)]);\n      t.setR(x, y, 0.98);\n      t.setH(x, y, 0.5 + fiber * 0.5);\n    });\n  });\n}\nconst TERRACOTTA = {\n  terracotta: 0x975d43, white_terracotta: 0xd1b1a1, orange_terracotta: 0xa15325,\n  yellow_terracotta: 0xba8523, red_terracotta: 0x8e3c2e, brown_terracotta: 0x4d3323,\n  light_gray_terracotta: 0x876b62,\n};\nfor (const [name, c] of Object.entries(TERRACOTTA)) {\n  def(name, (t) => {\n    const col = hex(c);\n    t.each((x, y, u, v) => {\n      const grain = P.tileFbm2(u * 16, v * 16, 16, 4) * 0.13;\n      const swirl = P2.tileFbm2(u * 5, v * 5, 5, 3) * 0.08;\n      const l = 1 + grain + swirl;\n      t.set(x, y, [clamp(col[0] * l, 0, 1), clamp(col[1] * l, 0, 1), clamp(col[2] * l, 0, 1)]);\n      t.setR(x, y, 0.7);\n      t.setH(x, y, 0.5 + grain * 2);\n    });\n  });\n}\n\n// 矿物方块\ndef('iron_block', (t) => mineralBlock(t, hex(0xd8d8d8), { metal: 1, rough: 0.28, facets: 3 }));\ndef('gold_block', (t) => mineralBlock(t, hex(0xf9d94a), { metal: 1, rough: 0.16, facets: 3 }));\ndef('copper_block', (t) => mineralBlock(t, hex(0xc3703f), { metal: 1, rough: 0.32, facets: 4 }));\ndef('diamond_block', (t) => mineralBlock(t, hex(0x62e6de), { metal: 0.1, rough: 0.08, facets: 5, gem: true }));\ndef('emerald_block', (t) => mineralBlock(t, hex(0x2fd05a), { metal: 0.1, rough: 0.1, facets: 5, gem: true }));\ndef('lapis_block', (t) => mineralBlock(t, hex(0x1e46b0), { metal: 0.05, rough: 0.42, facets: 6 }));\ndef('redstone_block', (t) => mineralBlock(t, hex(0xa81212), { metal: 0.05, rough: 0.5, facets: 8 }));\ndef('coal_block', (t) => mineralBlock(t, hex(0x141414), { metal: 0.0, rough: 0.55, facets: 6 }));\n\n// 植物（十字渲染）\ndef('tall_grass', (t) => plantCross(t, hex(0x7f8f6a), hex(0xc0cba8), null, { height: 0.75, bushy: 0.9, seed: 1 }));\ndef('fern', (t) => plantCross(t, hex(0x76866a), hex(0xb0bd98), null, { height: 0.85, bushy: 0.6, seed: 2 }));\ndef('dead_bush', (t) => plantCross(t, hex(0x6b4a22), hex(0x8a6634), null, { height: 0.7, bushy: 0.7, seed: 3 }));\ndef('dandelion', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0xf2d63a), { height: 0.72, bushy: 0.25, flower: true, flowerSize: 0.1, seed: 4 }));\ndef('poppy', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0xd42d24), { height: 0.72, bushy: 0.25, flower: true, flowerSize: 0.1, seed: 5 }));\ndef('blue_orchid', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0x2ab5e0), { height: 0.75, bushy: 0.2, flower: true, flowerSize: 0.09, seed: 6 }));\ndef('allium', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0xb96ee0), { height: 0.78, bushy: 0.2, flower: true, flowerSize: 0.1, seed: 7 }));\ndef('cornflower', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0x466ce0), { height: 0.74, bushy: 0.2, flower: true, flowerSize: 0.09, seed: 8 }));\ndef('oxeye_daisy', (t) => plantCross(t, hex(0x3f7a24), hex(0x5c9c34), hex(0xf0f0e6), { height: 0.74, bushy: 0.22, flower: true, flowerSize: 0.1, seed: 9 }));\ndef('brown_mushroom', (t) => {\n  t.fill([0, 0, 0], 0);\n  t.each((x, y, u, v) => {\n    const dx = u - 0.5;\n    if (v > 0.45 && v < 0.82 && Math.abs(dx) < 0.06) {\n      t.set(x, y, [0.86, 0.82, 0.74], 1);\n      t.setH(x, y, 0.7);\n    }\n    const cap = Math.sqrt(dx * dx * 1.6 + (v - 0.5) * (v - 0.5) * 4);\n    if (v <= 0.5 && cap < 0.3) {\n      const sh = 0.7 + (0.3 - cap) * 1.3;\n      t.set(x, y, [0.62 * sh, 0.44 * sh, 0.28 * sh], 1);\n      t.setH(x, y, 1);\n    }\n    t.setR(x, y, 0.9);\n  });\n});\ndef('red_mushroom', (t) => {\n  TEXTURES.brown_mushroom(t);\n  t.each((x, y, u, v) => {\n    const c = t.get(x, y);\n    const i = t.idx(x, y) * 4;\n    if (t.col[i + 3] > 0 && v <= 0.52 && c[0] > 0.3) {\n      t.set(x, y, [clamp(c[0] * 1.5, 0, 1), c[1] * 0.5, c[2] * 0.5], 1);\n      if (hash01(x, y, 3) > 0.8) t.set(x, y, [0.94, 0.94, 0.9], 1);\n    }\n  });\n});\ndef('sugar_cane', (t) => {\n  t.fill([0, 0, 0], 0);\n  t.each((x, y, u, v) => {\n    if (Math.abs(u - 0.5) < 0.13) {\n      const seg = Math.abs((v * 6) % 1 - 0.5) < 0.08 ? 0.7 : 1;\n      const g = P.tileFbm2(u * 20, v * 20, 20, 2) * 0.12;\n      t.set(x, y, [(0.53 + g) * seg, (0.76 + g) * seg, (0.42 + g) * seg], 1);\n      t.setR(x, y, 0.85);\n      t.setH(x, y, seg);\n    }\n    if (Math.abs(u - 0.5) > 0.13 && Math.abs(u - 0.5) < 0.42 && (v * 6) % 1 < 0.1 && v > 0.15) {\n      t.set(x, y, [0.45, 0.68, 0.35], 1);\n      t.setH(x, y, 0.6);\n    }\n  });\n});\ndef('wheat', (t) => {\n  t.fill([0, 0, 0], 0);\n  t.each((x, y, u, v) => {\n    const stalks = 5;\n    const sx = (u * stalks) % 1;\n    if (Math.abs(sx - 0.5) < 0.1 && v > 0.15) {\n      t.set(x, y, [0.72, 0.62, 0.22], 1);\n      t.setH(x, y, 0.7);\n    }\n    if (v < 0.45 && Math.abs(sx - 0.5) < 0.22 && (v * 10) % 1 < 0.5) {\n      t.set(x, y, [0.86, 0.74, 0.28], 1);\n      t.setH(x, y, 0.9);\n    }\n    t.setR(x, y, 0.9);\n  });\n});\ndef('cactus_side', (t) => {\n  t.each((x, y, u, v) => {\n    const ribs = Math.abs(Math.sin(u * Math.PI * 4));\n    const base = mix3(hex(0x2f5c1e), hex(0x5c9a3a), ribs);\n    const g = P.tileFbm2(u * 18, v * 18, 18, 3) * 0.08;\n    t.set(x, y, [base[0] + g, base[1] + g, base[2] + g]);\n    t.setR(x, y, 0.8);\n    t.setH(x, y, ribs);\n    if (Math.abs((u * 4) % 1 - 0.5) < 0.05 && (v * 8) % 1 < 0.12) {\n      t.set(x, y, [0.86, 0.86, 0.78]);\n      t.setH(x, y, 1);\n    }\n  });\n});\ndef('cactus_top', (t) => {\n  t.each((x, y, u, v) => {\n    const dx = u - 0.5, dy = v - 0.5;\n    const r = Math.sqrt(dx * dx + dy * dy);\n    const c = mix3(hex(0x74b04a), hex(0x2f5c1e), smoothstep(0.2, 0.45, r));\n    t.set(x, y, c);\n    t.setR(x, y, 0.8);\n    t.setH(x, y, 1 - r);\n  });\n});\ndef('pumpkin_top', (t) => {\n  t.each((x, y, u, v) => {\n    const dx = u - 0.5, dy = v - 0.5;\n    const r = Math.sqrt(dx * dx + dy * dy);\n    const c = r < 0.13 ? hex(0x6b5227) : mix3(hex(0xd4791b), hex(0xa8590f), Math.abs(Math.sin(Math.atan2(dy, dx) * 5)));\n    t.set(x, y, c);\n    t.setR(x, y, 0.75);\n    t.setH(x, y, r < 0.13 ? 1 : 0.6);\n  });\n});\ndef('pumpkin_side', (t) => {\n  t.each((x, y, u, v) => {\n    const ribs = Math.abs(Math.sin(u * Math.PI * 4));\n    const c = mix3(hex(0xa8590f), hex(0xe08a24), ribs);\n    const g = P.tileFbm2(u * 14, v * 14, 14, 3) * 0.07;\n    t.set(x, y, [clamp(c[0] + g, 0, 1), clamp(c[1] + g, 0, 1), clamp(c[2] + g, 0, 1)]);\n    t.setR(x, y, 0.75);\n    t.setH(x, y, ribs);\n  });\n});\ndef('pumpkin_face', (t) => {\n  TEXTURES.pumpkin_side(t);\n  t.each((x, y, u, v) => {\n    const eye = (Math.abs(u - 0.3) < 0.11 || Math.abs(u - 0.7) < 0.11) && v > 0.3 && v < 0.48 &&\n      Math.abs(u - 0.5) * 1.0 > (0.5 - v) * 0.5;\n    const mouth = v > 0.6 && v < 0.78 && Math.abs(u - 0.5) < 0.28 && (Math.floor(u * 10) % 2 === 0 || v < 0.68);\n    if (eye || mouth) {\n      t.set(x, y, [0.1, 0.07, 0.03]);\n      t.setH(x, y, 0.05);\n    }\n  });\n});\ndef('melon_top', (t) => {\n  t.each((x, y, u, v) => {\n    const n = P.tileFbm2(u * 10, v * 10, 10, 3) * 0.5 + 0.5;\n    t.set(x, y, mix3(hex(0x4f7a1f), hex(0x88b53a), n));\n    t.setR(x, y, 0.6);\n    t.setH(x, y, n);\n  });\n});\ndef('melon_side', (t) => {\n  t.each((x, y, u, v) => {\n    const stripe = Math.abs(Math.sin(u * Math.PI * 5)) > 0.55 ? 1 : 0;\n    const n = P.tileFbm2(u * 12, v * 12, 12, 3) * 0.5 + 0.5;\n    const c = stripe ? mix3(hex(0x3f6417), hex(0x5c8a24), n) : mix3(hex(0x86b23a), hex(0xa8cc5c), n);\n    t.set(x, y, c);\n    t.setR(x, y, 0.6);\n    t.setH(x, y, 0.5 + n * 0.5);\n  });\n});\n\n// 树苗（十字渲染的小树）\nconst SAPLING_COLORS = {\n  oak: [0x3f6b22, 0x6ba03a], birch: [0x5c8a2e, 0x93bd5c], spruce: [0x2f5c33, 0x4f7d4a],\n  jungle: [0x2f7a1e, 0x54a83a], acacia: [0x5c7a1e, 0x93b53a], dark_oak: [0x2f5c1a, 0x54802a],\n};\nfor (const [w, [a, b]] of Object.entries(SAPLING_COLORS)) {\n  def(`${w}_sapling`, (t) => {\n    t.fill([0, 0, 0], 0);\n    const s = t.size;\n    // 主干\n    for (let y = Math.floor(s * 0.42); y < s; y++) {\n      for (let dx = -1; dx <= 1; dx++) {\n        t.set(Math.floor(s / 2) + dx, y, [0.42, 0.31, 0.16], 1);\n        t.setH(Math.floor(s / 2) + dx, y, 0.7);\n      }\n    }\n    // 树冠\n    t.each((x, y, u, v) => {\n      const dx = u - 0.5, dy = v - 0.32;\n      const r = Math.sqrt(dx * dx * 1.3 + dy * dy * 2.2);\n      const wob = P.tileFbm2(u * 12, v * 12, 12, 3) * 0.09;\n      if (r + wob < 0.26) {\n        const m = P2.tileFbm2(u * 16, v * 16, 16, 3) * 0.5 + 0.5;\n        if (m > 0.28) {\n          const c = mix3(hex(a), hex(b), m);\n          t.set(x, y, c, 1);\n          t.setR(x, y, 0.85);\n          t.setH(x, y, m);\n        }\n      }\n    });\n  });\n}\n\n// ── 打包成 GPU 可用的数据 ─────────────────────────────────────\n\nexport const TEX_NAMES = Object.keys(TEXTURES);\nexport const TEX_INDEX = {};\nTEX_NAMES.forEach((n, i) => (TEX_INDEX[n] = i));\n\n/**\n * 生成所有材质，返回 { albedo, normal, count, size, canvases }\n * albedo: Uint8Array (RGBA)，normal: Uint8Array (法线 XYZ + 粗糙度A)\n */\nexport function buildTextureData() {\n  const s = TEX_SIZE;\n  const count = TEX_NAMES.length;\n  const albedo = new Uint8Array(s * s * 4 * count);\n  const normal = new Uint8Array(s * s * 4 * count);\n  const extra = new Uint8Array(s * s * 4 * count); // R=金属度 其余保留\n  const canvases = [];\n\n  for (let li = 0; li < count; li++) {\n    const t = new Tex(s);\n    TEXTURES[TEX_NAMES[li]](t);\n    const off = li * s * s * 4;\n\n    for (let i = 0; i < s * s; i++) {\n      albedo[off + i * 4] = clamp(t.col[i * 4] * 255, 0, 255);\n      albedo[off + i * 4 + 1] = clamp(t.col[i * 4 + 1] * 255, 0, 255);\n      albedo[off + i * 4 + 2] = clamp(t.col[i * 4 + 2] * 255, 0, 255);\n      albedo[off + i * 4 + 3] = clamp(t.col[i * 4 + 3] * 255, 0, 255);\n      extra[off + i * 4] = clamp(t.metal[i] * 255, 0, 255);\n    }\n\n    // Sobel 求法线（环绕采样，保证无缝）\n    const H = (x, y) => t.height[t.idx(x, y)];\n    const strength = 1.8;\n    for (let y = 0; y < s; y++) {\n      for (let x = 0; x < s; x++) {\n        const dX =\n          (H(x + 1, y - 1) + 2 * H(x + 1, y) + H(x + 1, y + 1)) -\n          (H(x - 1, y - 1) + 2 * H(x - 1, y) + H(x - 1, y + 1));\n        const dY =\n          (H(x - 1, y + 1) + 2 * H(x, y + 1) + H(x + 1, y + 1)) -\n          (H(x - 1, y - 1) + 2 * H(x, y - 1) + H(x + 1, y - 1));\n        let nx = -dX * strength, ny = -dY * strength, nz = 1;\n        const len = Math.hypot(nx, ny, nz) || 1;\n        nx /= len; ny /= len; nz /= len;\n        const i = y * s + x;\n        normal[off + i * 4] = clamp((nx * 0.5 + 0.5) * 255, 0, 255);\n        normal[off + i * 4 + 1] = clamp((ny * 0.5 + 0.5) * 255, 0, 255);\n        normal[off + i * 4 + 2] = clamp((nz * 0.5 + 0.5) * 255, 0, 255);\n        normal[off + i * 4 + 3] = clamp(t.rough[i] * 255, 0, 255);\n      }\n    }\n    canvases.push(null);\n  }\n  return { albedo, normal, extra, count, size: s };\n}\n\n/** 取出某一层的 ImageData，供 2D 界面（物品图标）使用 */\nexport function layerToCanvas(albedo, layer, size = TEX_SIZE) {\n  const c = document.createElement('canvas');\n  c.width = size;\n  c.height = size;\n  const ctx = c.getContext('2d');\n  const img = ctx.createImageData(size, size);\n  img.data.set(albedo.subarray(layer * size * size * 4, (layer + 1) * size * size * 4));\n  ctx.putImageData(img, 0, 0);\n  return c;\n}\n","src/ui/sound.js":"// 程序化音效：全部用 WebAudio 合成，不需要任何音频文件\n\nexport class Sound {\n  constructor() {\n    this.ctx = null;\n    this.enabled = true;\n    this.master = null;\n    this.noiseBuffer = null;\n  }\n\n  ensure() {\n    if (this.ctx) return;\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (!AC) { this.enabled = false; return; }\n    this.ctx = new AC();\n    this.master = this.ctx.createGain();\n    this.master.gain.value = 0.35;\n    this.master.connect(this.ctx.destination);\n    // 预生成白噪声\n    const len = this.ctx.sampleRate * 1.2;\n    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;\n    this.noiseBuffer = buf;\n  }\n\n  resume() {\n    this.ensure();\n    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();\n  }\n\n  noise(dur, freq, q, gain, type = 'bandpass', sweep = 0) {\n    if (!this.enabled) return;\n    this.ensure();\n    if (!this.ctx) return;\n    const t = this.ctx.currentTime;\n    const src = this.ctx.createBufferSource();\n    src.buffer = this.noiseBuffer;\n    src.loop = true;\n    const f = this.ctx.createBiquadFilter();\n    f.type = type;\n    f.frequency.setValueAtTime(freq, t);\n    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t + dur);\n    f.Q.value = q;\n    const g = this.ctx.createGain();\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.008);\n    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);\n    src.connect(f); f.connect(g); g.connect(this.master);\n    src.start(t);\n    src.stop(t + dur + 0.02);\n  }\n\n  tone(dur, freq, gain, type = 'sine', endFreq = null) {\n    if (!this.enabled) return;\n    this.ensure();\n    if (!this.ctx) return;\n    const t = this.ctx.currentTime;\n    const o = this.ctx.createOscillator();\n    o.type = type;\n    o.frequency.setValueAtTime(freq, t);\n    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);\n    const g = this.ctx.createGain();\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.01);\n    g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n    o.connect(g); g.connect(this.master);\n    o.start(t);\n    o.stop(t + dur + 0.02);\n  }\n\n  play(name, material = 'stone') {\n    if (!this.enabled) return;\n    switch (name) {\n      case 'dig': {\n        const cfg = {\n          stone: [700, 4, 0.16], wood: [420, 3, 0.16], dirt: [260, 1.4, 0.18],\n          sand: [1600, 0.9, 0.12], grass: [320, 1.2, 0.16], metal: [1400, 8, 0.12],\n          glass: [2600, 6, 0.14], wool: [200, 1, 0.12], plant: [900, 1.5, 0.1],\n        }[material] || [600, 3, 0.15];\n        this.noise(0.09, cfg[0], cfg[1], cfg[2], 'bandpass', 0.7);\n        break;\n      }\n      case 'break':\n        this.noise(0.22, 900, 1.6, 0.22, 'bandpass', 0.35);\n        this.tone(0.1, 180, 0.05, 'triangle', 90);\n        break;\n      case 'place':\n        this.noise(0.11, 520, 2.5, 0.2, 'bandpass', 0.6);\n        break;\n      case 'step':\n        this.noise(0.07, 340, 1.1, 0.09, 'bandpass', 0.7);\n        break;\n      case 'hurt':\n        this.tone(0.18, 320, 0.16, 'square', 150);\n        break;\n      case 'mobhurt':\n        this.tone(0.15, 420, 0.12, 'sawtooth', 200);\n        break;\n      case 'eat':\n        this.noise(0.12, 400, 1.2, 0.14, 'bandpass', 0.8);\n        break;\n      case 'craft':\n        this.tone(0.09, 620, 0.1, 'square', 880);\n        break;\n      case 'pickup':\n        this.tone(0.07, 900, 0.08, 'sine', 1400);\n        break;\n      case 'explode':\n        this.noise(0.9, 180, 0.7, 0.5, 'lowpass', 0.15);\n        this.tone(0.6, 90, 0.25, 'sine', 30);\n        break;\n      case 'bow':\n        this.noise(0.16, 1200, 2, 0.14, 'bandpass', 0.4);\n        break;\n      case 'splash':\n        this.noise(0.3, 1400, 1, 0.18, 'bandpass', 0.25);\n        break;\n      case 'fuse':\n        this.noise(0.5, 2400, 1.5, 0.1, 'highpass', 0.9);\n        break;\n      case 'door':\n        this.noise(0.2, 300, 2, 0.14, 'bandpass', 1.6);\n        break;\n      default:\n        break;\n    }\n  }\n}\n\n/** 方块名 → 音效材质 */\nexport function soundMaterial(name) {\n  if (!name) return 'stone';\n  if (/wool/.test(name)) return 'wool';\n  if (/glass|ice/.test(name)) return 'glass';\n  if (/log|planks|table|chest|bookshelf|ladder|slab/.test(name)) return 'wood';\n  if (/sand|gravel/.test(name)) return 'sand';\n  if (/dirt|clay|farmland|podzol|mycelium|path/.test(name)) return 'dirt';\n  if (/grass|leaves|flower|mushroom|sapling|cane|cactus|wheat|fern|bush/.test(name)) return 'grass';\n  if (/iron|gold|diamond|emerald|copper|redstone_block|coal_block/.test(name)) return 'metal';\n  return 'stone';\n}\n","src/ui/ui.js":"// 界面：HUD、背包、合成台、熔炉、箱子、创造模式物品栏\n\nimport { getItem, ITEMS } from '../world/items.js';\nimport { matchRecipe, SMELTING, fuelValue } from '../world/recipes.js';\nimport { Inventory, makeStack, maxStack, sameStack } from '../world/inventory.js';\nimport { BLOCK_BY_NAME } from '../world/blocks.js';\n\nconst el = (tag, cls, parent) => {\n  const e = document.createElement(tag);\n  if (cls) e.className = cls;\n  if (parent) parent.appendChild(e);\n  return e;\n};\n\nexport class UI {\n  constructor(game, icons) {\n    this.game = game;\n    this.icons = icons;           // Map(itemName → canvas)\n    this.root = document.getElementById('ui');\n    this.screen = null;           // 当前打开的界面\n    this.slotEls = [];\n    this.tooltip = null;\n    this.build();\n  }\n\n  build() {\n    const root = this.root;\n    root.innerHTML = '';\n\n    // 准星\n    this.crosshair = el('div', 'crosshair', root);\n\n    // 受伤/水下滤镜\n    this.overlayFx = el('div', 'screen-fx', root);\n\n    // 状态栏\n    this.hud = el('div', 'hud', root);\n    this.statsLeft = el('div', 'stats stats-left', this.hud);\n    this.statsRight = el('div', 'stats stats-right', this.hud);\n    this.hotbarEl = el('div', 'hotbar', this.hud);\n    this.hotbarSlots = [];\n    for (let i = 0; i < 9; i++) {\n      const s = this.makeSlot(this.hotbarEl, { inv: 'player', index: i });\n      this.hotbarSlots.push(s);\n    }\n    this.itemName = el('div', 'item-name', root);\n\n    // 调试信息\n    this.debug = el('div', 'debug hidden', root);\n\n    // 提示条\n    this.toast = el('div', 'toast', root);\n\n    // 屏幕层\n    this.modal = el('div', 'modal hidden', root);\n    this.modalPanel = el('div', 'panel', this.modal);\n\n    // 死亡界面\n    this.deathScreen = el('div', 'death hidden', root);\n    const dbox = el('div', 'death-box', this.deathScreen);\n    el('h1', null, dbox).textContent = '你死了！';\n    this.deathCause = el('p', null, dbox);\n    const btn = el('button', null, dbox);\n    btn.textContent = '重生';\n    btn.onclick = () => this.game.respawn();\n\n    // 拖拽中的物品\n    this.cursorEl = el('div', 'cursor-item hidden', root);\n    this.cursorCanvas = el('canvas', null, this.cursorEl);\n    this.cursorCanvas.width = this.cursorCanvas.height = 48;\n    this.cursorCount = el('span', 'count', this.cursorEl);\n\n    document.addEventListener('mousemove', (e) => {\n      this.mouseX = e.clientX;\n      this.mouseY = e.clientY;\n      if (this.game.player.cursor) {\n        this.cursorEl.style.left = e.clientX + 'px';\n        this.cursorEl.style.top = e.clientY + 'px';\n      }\n      if (this.tooltip) {\n        this.tooltip.style.left = e.clientX + 14 + 'px';\n        this.tooltip.style.top = e.clientY + 14 + 'px';\n      }\n    });\n  }\n\n  makeSlot(parent, ref) {\n    const s = el('div', 'slot', parent);\n    const c = el('canvas', null, s);\n    c.width = c.height = 48;\n    const n = el('span', 'count', s);\n    const dur = el('div', 'durability', s);\n    const slot = { el: s, canvas: c, count: n, dur, ref };\n    s.addEventListener('mousedown', (e) => {\n      e.preventDefault();\n      e.stopPropagation();\n      this.onSlotClick(slot, e.button, e.shiftKey);\n    });\n    s.addEventListener('mouseenter', () => this.showTooltip(slot));\n    s.addEventListener('mouseleave', () => this.hideTooltip());\n    s.addEventListener('contextmenu', (e) => e.preventDefault());\n    return slot;\n  }\n\n  drawSlot(slot, stack) {\n    const ctx = slot.canvas.getContext('2d');\n    ctx.clearRect(0, 0, 48, 48);\n    if (!stack) {\n      slot.count.textContent = '';\n      slot.dur.style.display = 'none';\n      slot.stack = null;\n      return;\n    }\n    const icon = this.icons.get(stack.item);\n    if (icon) ctx.drawImage(icon, 0, 0, 48, 48);\n    slot.count.textContent = stack.count > 1 ? stack.count : '';\n    const def = getItem(stack.item);\n    const maxDur = def && def.tool ? def.tool.durability : def && def.armor ? def.armor.durability : null;\n    if (maxDur && stack.durability !== null && stack.durability < maxDur) {\n      const f = stack.durability / maxDur;\n      slot.dur.style.display = 'block';\n      slot.dur.style.width = `${Math.max(2, f * 100)}%`;\n      slot.dur.style.background = `hsl(${f * 120}, 90%, 45%)`;\n    } else {\n      slot.dur.style.display = 'none';\n    }\n    slot.stack = stack;\n  }\n\n  showTooltip(slot) {\n    const stack = this.getStack(slot.ref);\n    if (!stack) return;\n    this.hideTooltip();\n    const def = getItem(stack.item);\n    this.tooltip = el('div', 'tooltip', this.root);\n    this.tooltip.textContent = def ? def.display : stack.item;\n    if (def && def.tool) {\n      const sub = el('div', 'sub', this.tooltip);\n      sub.textContent = `耐久 ${stack.durability}/${def.tool.durability} · 伤害 ${def.tool.damage}`;\n    } else if (def && def.armor) {\n      const sub = el('div', 'sub', this.tooltip);\n      sub.textContent = `护甲 +${def.armor.defense} · 耐久 ${stack.durability}/${def.armor.durability}`;\n    } else if (def && def.food) {\n      const sub = el('div', 'sub', this.tooltip);\n      sub.textContent = `回复饱食 ${def.food.hunger}`;\n    }\n    this.tooltip.style.left = (this.mouseX || 0) + 14 + 'px';\n    this.tooltip.style.top = (this.mouseY || 0) + 14 + 'px';\n  }\n\n  hideTooltip() {\n    if (this.tooltip) { this.tooltip.remove(); this.tooltip = null; }\n  }\n\n  // ── 槽位数据访问 ──\n  getInv(ref) {\n    const p = this.game.player;\n    switch (ref.inv) {\n      case 'player': return p.inventory;\n      case 'armor': return p.armor;\n      case 'craft': return this.craftInv;\n      case 'result': return this.resultInv;\n      case 'container': return this.containerInv;\n      case 'creative': return null;\n      default: return null;\n    }\n  }\n  getStack(ref) {\n    if (ref.inv === 'creative') return ref.stack || null;\n    const inv = this.getInv(ref);\n    return inv ? inv.get(ref.index) : null;\n  }\n  setStack(ref, s) {\n    const inv = this.getInv(ref);\n    if (inv) inv.set(ref.index, s);\n  }\n\n  onSlotClick(slot, button, shift) {\n    const p = this.game.player;\n    const ref = slot.ref;\n\n    // 创造模式物品栏：无限取用\n    if (ref.inv === 'creative') {\n      const st = ref.stack;\n      if (!st) return;\n      if (shift) { p.inventory.add(st.item, maxStack(st.item)); }\n      else p.cursor = makeStack(st.item, button === 2 ? 1 : maxStack(st.item));\n      this.refresh();\n      return;\n    }\n\n    // 合成结果槽\n    if (ref.inv === 'result') {\n      this.takeCraftResult(shift);\n      this.refresh();\n      return;\n    }\n    // 熔炉输出槽\n    if (ref.inv === 'container' && this.screen === 'furnace' && ref.index === 2) {\n      const out = this.containerInv.get(2);\n      if (out) {\n        if (shift || !p.cursor) {\n          const left = p.inventory.add(out.item, out.count);\n          if (left === 0) this.containerInv.set(2, null);\n          else out.count = left;\n        }\n      }\n      this.refresh();\n      return;\n    }\n\n    const inv = this.getInv(ref);\n    if (!inv) return;\n    const cur = inv.get(ref.index);\n\n    if (shift) {\n      // 快速移动\n      this.quickMove(ref, inv, cur);\n      this.refresh();\n      return;\n    }\n\n    if (button === 2) {\n      // 右键：放一个 / 拿一半\n      if (p.cursor) {\n        if (!cur) {\n          if (this.canPlace(ref, p.cursor)) {\n            inv.set(ref.index, makeStack(p.cursor.item, 1, p.cursor.durability));\n            p.cursor.count--;\n            if (p.cursor.count <= 0) p.cursor = null;\n          }\n        } else if (sameStack(cur, p.cursor) && cur.count < maxStack(cur.item)) {\n          cur.count++;\n          p.cursor.count--;\n          if (p.cursor.count <= 0) p.cursor = null;\n        }\n      } else if (cur) {\n        const half = Math.ceil(cur.count / 2);\n        p.cursor = makeStack(cur.item, half, cur.durability);\n        cur.count -= half;\n        if (cur.count <= 0) inv.set(ref.index, null);\n      }\n    } else {\n      // 左键\n      if (p.cursor && cur && sameStack(cur, p.cursor)) {\n        const max = maxStack(cur.item);\n        const move = Math.min(max - cur.count, p.cursor.count);\n        cur.count += move;\n        p.cursor.count -= move;\n        if (p.cursor.count <= 0) p.cursor = null;\n      } else if (p.cursor) {\n        if (this.canPlace(ref, p.cursor)) {\n          inv.set(ref.index, p.cursor);\n          p.cursor = cur;\n        }\n      } else if (cur) {\n        p.cursor = cur;\n        inv.set(ref.index, null);\n      }\n    }\n    this.refresh();\n  }\n\n  canPlace(ref, stack) {\n    if (ref.inv === 'armor') {\n      const def = getItem(stack.item);\n      return !!(def && def.armor && def.armor.slot === ref.index);\n    }\n    if (ref.inv === 'container' && this.screen === 'furnace') {\n      if (ref.index === 1) return fuelValue(stack.item) > 0;\n      if (ref.index === 2) return false;\n    }\n    return true;\n  }\n\n  quickMove(ref, inv, cur) {\n    if (!cur) return;\n    const p = this.game.player;\n    if (ref.inv === 'player') {\n      // 背包 ⇄ 容器 / 快捷栏\n      if (this.screen === 'chest' || this.screen === 'furnace') {\n        const target = this.containerInv;\n        const limit = this.screen === 'furnace' ? 1 : target.size;\n        let left = cur.count;\n        for (let i = 0; i < limit && left > 0; i++) {\n          const s = target.get(i);\n          if (!s) { target.set(i, makeStack(cur.item, left, cur.durability)); left = 0; }\n          else if (sameStack(s, cur)) {\n            const move = Math.min(maxStack(cur.item) - s.count, left);\n            s.count += move; left -= move;\n          }\n        }\n        cur.count = left;\n        if (left <= 0) inv.set(ref.index, null);\n        return;\n      }\n      // 快捷栏 ⇄ 背包\n      const toHotbar = ref.index >= 9;\n      const from = ref.index;\n      const range = toHotbar ? [0, 9] : [9, 36];\n      let left = cur.count;\n      for (let i = range[0]; i < range[1] && left > 0; i++) {\n        const s = inv.get(i);\n        if (s && sameStack(s, cur)) {\n          const move = Math.min(maxStack(cur.item) - s.count, left);\n          s.count += move; left -= move;\n        }\n      }\n      for (let i = range[0]; i < range[1] && left > 0; i++) {\n        if (!inv.get(i)) { inv.set(i, makeStack(cur.item, left, cur.durability)); left = 0; }\n      }\n      cur.count = left;\n      if (left <= 0) inv.set(from, null);\n    } else {\n      // 容器/合成格 → 玩家背包\n      const left = p.inventory.add(cur.item, cur.count);\n      cur.count = left;\n      if (left <= 0) inv.set(ref.index, null);\n    }\n  }\n\n  // ── 合成 ──\n  updateCraftResult() {\n    if (!this.craftInv) return;\n    const n = this.craftSize;\n    const grid = [];\n    for (let i = 0; i < n * n; i++) grid.push(this.craftInv.get(i));\n    const r = matchRecipe(grid, n, n);\n    this.resultInv.set(0, r ? makeStack(r.result, r.count) : null);\n    this.currentRecipe = r;\n  }\n\n  takeCraftResult(all) {\n    const p = this.game.player;\n    const res = this.resultInv.get(0);\n    if (!res) return;\n    let times = 1;\n    if (all) {\n      times = 64;\n      for (let i = 0; i < this.craftInv.size; i++) {\n        const s = this.craftInv.get(i);\n        if (s) times = Math.min(times, s.count);\n      }\n    }\n    for (let t = 0; t < times; t++) {\n      const r = this.currentRecipe;\n      if (!r) break;\n      if (all) {\n        if (p.inventory.add(r.result, r.count) > 0) break;\n      } else if (p.cursor) {\n        if (!sameStack(p.cursor, { item: r.result }) ||\n            p.cursor.count + r.count > maxStack(r.result)) break;\n        p.cursor.count += r.count;\n      } else {\n        p.cursor = makeStack(r.result, r.count);\n      }\n      for (let i = 0; i < this.craftInv.size; i++) {\n        const s = this.craftInv.get(i);\n        if (s) { s.count--; if (s.count <= 0) this.craftInv.set(i, null); }\n      }\n      this.updateCraftResult();\n      if (!all) break;\n    }\n    this.game.sound && this.game.sound('craft');\n  }\n\n  /** 关闭界面时把合成格里的东西还给玩家 */\n  dumpCrafting() {\n    if (!this.craftInv) return;\n    const p = this.game.player;\n    for (let i = 0; i < this.craftInv.size; i++) {\n      const s = this.craftInv.get(i);\n      if (s) {\n        const left = p.inventory.add(s.item, s.count);\n        if (left > 0) this.game.dropItem(s.item, left);\n        this.craftInv.set(i, null);\n      }\n    }\n  }\n\n  // ── 界面开关 ──\n  open(kind, data = {}) {\n    this.close(false);\n    this.screen = kind;\n    this.slotEls = [];\n    this.modal.classList.remove('hidden');\n    const panel = this.modalPanel;\n    panel.innerHTML = '';\n    panel.className = 'panel panel-' + kind;\n\n    if (kind === 'inventory' || kind === 'crafting_table') {\n      this.craftSize = kind === 'crafting_table' ? 3 : 2;\n      this.craftInv = new Inventory(this.craftSize * this.craftSize);\n      this.resultInv = new Inventory(1);\n      this.buildCraftPanel(panel, kind);\n    } else if (kind === 'furnace') {\n      this.containerInv = data.inv;\n      this.tile = data.tile;\n      this.buildFurnacePanel(panel);\n    } else if (kind === 'chest') {\n      this.containerInv = data.inv;\n      this.buildChestPanel(panel);\n    } else if (kind === 'creative') {\n      this.buildCreativePanel(panel);\n    }\n    this.refresh();\n    document.exitPointerLock && document.exitPointerLock();\n  }\n\n  close(dump = true) {\n    if (dump && (this.screen === 'inventory' || this.screen === 'crafting_table')) this.dumpCrafting();\n    const p = this.game.player;\n    if (dump && p && p.cursor) {\n      const left = p.inventory.add(p.cursor.item, p.cursor.count);\n      if (left > 0) this.game.dropItem(p.cursor.item, left);\n      p.cursor = null;\n    }\n    this.screen = null;\n    this.modal.classList.add('hidden');\n    this.hideTooltip();\n    this.craftInv = null;\n    this.containerInv = null;\n    this.refresh();\n  }\n\n  title(parent, text) {\n    const h = el('div', 'panel-title', parent);\n    h.textContent = text;\n    return h;\n  }\n\n  buildInventoryGrid(parent) {\n    const wrap = el('div', 'inv-grid', parent);\n    for (let i = 9; i < 36; i++) {\n      this.slotEls.push(this.makeSlot(wrap, { inv: 'player', index: i }));\n    }\n    const hb = el('div', 'inv-hotbar', parent);\n    for (let i = 0; i < 9; i++) {\n      this.slotEls.push(this.makeSlot(hb, { inv: 'player', index: i }));\n    }\n  }\n\n  buildCraftPanel(panel, kind) {\n    this.title(panel, kind === 'crafting_table' ? '工作台' : '物品栏');\n    const top = el('div', 'panel-top', panel);\n\n    if (kind === 'inventory') {\n      const armorCol = el('div', 'armor-col', top);\n      const labels = ['头盔', '胸甲', '护腿', '靴子'];\n      for (let i = 0; i < 4; i++) {\n        const s = this.makeSlot(armorCol, { inv: 'armor', index: i });\n        s.el.dataset.hint = labels[i];\n        this.slotEls.push(s);\n      }\n      el('div', 'player-preview', top);\n    }\n\n    const craftBox = el('div', 'craft-box', top);\n    const grid = el('div', `craft-grid craft-${this.craftSize}`, craftBox);\n    for (let i = 0; i < this.craftSize * this.craftSize; i++) {\n      this.slotEls.push(this.makeSlot(grid, { inv: 'craft', index: i }));\n    }\n    el('div', 'arrow', craftBox);\n    const res = el('div', 'result-slot', craftBox);\n    this.slotEls.push(this.makeSlot(res, { inv: 'result', index: 0 }));\n\n    this.buildInventoryGrid(panel);\n  }\n\n  buildFurnacePanel(panel) {\n    this.title(panel, '熔炉');\n    const top = el('div', 'panel-top furnace-top', panel);\n    const col = el('div', 'furnace-col', top);\n    this.slotEls.push(this.makeSlot(col, { inv: 'container', index: 0 }));\n    this.fireEl = el('div', 'fire', col);\n    this.slotEls.push(this.makeSlot(col, { inv: 'container', index: 1 }));\n    const arrowWrap = el('div', 'furnace-arrow', top);\n    this.smeltArrow = el('div', 'arrow-fill', arrowWrap);\n    const out = el('div', 'result-slot', top);\n    this.slotEls.push(this.makeSlot(out, { inv: 'container', index: 2 }));\n    this.buildInventoryGrid(panel);\n  }\n\n  buildChestPanel(panel) {\n    this.title(panel, '箱子');\n    const grid = el('div', 'inv-grid', panel);\n    for (let i = 0; i < 27; i++) {\n      this.slotEls.push(this.makeSlot(grid, { inv: 'container', index: i }));\n    }\n    this.buildInventoryGrid(panel);\n  }\n\n  buildCreativePanel(panel) {\n    this.title(panel, '创造模式物品栏');\n    const search = el('input', 'creative-search', panel);\n    search.placeholder = '搜索物品…';\n    const grid = el('div', 'creative-grid', panel);\n    const render = (filter) => {\n      grid.innerHTML = '';\n      this.slotEls = this.slotEls.filter((s) => s.ref.inv !== 'creative');\n      for (const [name, it] of ITEMS) {\n        if (filter && !it.display.includes(filter) && !name.includes(filter)) continue;\n        const s = this.makeSlot(grid, { inv: 'creative', stack: makeStack(name, 1) });\n        this.drawSlot(s, { item: name, count: 1, durability: null });\n        s.count.textContent = '';\n      }\n    };\n    search.oninput = () => render(search.value.trim());\n    render('');\n    this.buildInventoryGrid(panel);\n  }\n\n  // ── 每帧刷新 ──\n  refresh() {\n    const p = this.game.player;\n    if (!p) return;\n    for (let i = 0; i < 9; i++) {\n      this.drawSlot(this.hotbarSlots[i], p.inventory.get(i));\n      this.hotbarSlots[i].el.classList.toggle('selected', i === p.hotbar);\n    }\n    for (const s of this.slotEls) {\n      if (s.ref.inv === 'creative') continue;\n      this.drawSlot(s, this.getStack(s.ref));\n    }\n    if (this.craftInv) this.updateCraftResult();\n    if (this.craftInv && this.resultInv) {\n      const rs = this.slotEls.find((s) => s.ref.inv === 'result');\n      if (rs) this.drawSlot(rs, this.resultInv.get(0));\n    }\n\n    // 光标物品\n    if (p.cursor) {\n      this.cursorEl.classList.remove('hidden');\n      const ctx = this.cursorCanvas.getContext('2d');\n      ctx.clearRect(0, 0, 48, 48);\n      const icon = this.icons.get(p.cursor.item);\n      if (icon) ctx.drawImage(icon, 0, 0, 48, 48);\n      this.cursorCount.textContent = p.cursor.count > 1 ? p.cursor.count : '';\n    } else {\n      this.cursorEl.classList.add('hidden');\n    }\n    this.updateStats();\n  }\n\n  updateStats() {\n    const p = this.game.player;\n    const survival = p.gamemode === 'survival';\n    this.statsLeft.innerHTML = '';\n    this.statsRight.innerHTML = '';\n    if (!survival) return;\n\n    const row = (parent, n, cls, full, half) => {\n      for (let i = 0; i < n; i++) {\n        const d = el('div', 'icon ' + cls, parent);\n        const v = i * 2;\n        if (full > v + 1) d.classList.add('full');\n        else if (half && full > v) d.classList.add('half');\n      }\n    };\n    // 护甲\n    const ap = p.armorPoints;\n    if (ap > 0) {\n      const armorRow = el('div', 'row', this.statsLeft);\n      row(armorRow, 10, 'armor', ap, true);\n    }\n    const hpRow = el('div', 'row', this.statsLeft);\n    row(hpRow, 10, 'heart', p.health, true);\n    if (p.hurtCooldown > 0) hpRow.classList.add('shake');\n\n    const foodRow = el('div', 'row', this.statsRight);\n    row(foodRow, 10, 'food', p.food, true);\n    if (p.air < 300) {\n      const airRow = el('div', 'row', this.statsRight);\n      row(airRow, 10, 'bubble', Math.ceil(p.air / 15), false);\n    }\n  }\n\n  setItemName(text) {\n    this.itemName.textContent = text;\n    this.itemName.style.opacity = 1;\n    clearTimeout(this._nameTimer);\n    this._nameTimer = setTimeout(() => { this.itemName.style.opacity = 0; }, 1600);\n  }\n\n  showToast(text, ms = 2200) {\n    this.toast.textContent = text;\n    this.toast.style.opacity = 1;\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => { this.toast.style.opacity = 0; }, ms);\n  }\n\n  setDebug(lines) {\n    this.debug.innerHTML = lines.map((l) => `<div>${l}</div>`).join('');\n  }\n\n  toggleDebug() {\n    this.debug.classList.toggle('hidden');\n  }\n\n  showDeath(cause) {\n    this.deathCause.textContent = cause ? `死因：${cause}` : '';\n    this.deathScreen.classList.remove('hidden');\n    document.exitPointerLock && document.exitPointerLock();\n  }\n  hideDeath() {\n    this.deathScreen.classList.add('hidden');\n  }\n\n  setFx(kind, amount) {\n    if (kind === 'hurt') {\n      this.overlayFx.style.background = `rgba(200,20,20,${amount * 0.42})`;\n    } else if (kind === 'water') {\n      this.overlayFx.style.background = `rgba(30,90,170,${amount * 0.45})`;\n    } else if (kind === 'lava') {\n      this.overlayFx.style.background = `rgba(220,90,10,${amount * 0.75})`;\n    } else {\n      this.overlayFx.style.background = 'transparent';\n    }\n  }\n}\n\nexport { BLOCK_BY_NAME, SMELTING };\n","src/util/mat4.js":"// 极简 4x4 矩阵 / 向量运算（列主序，与 WebGL 一致）\n\nexport function identity(o = new Float32Array(16)) {\n  o.fill(0);\n  o[0] = o[5] = o[10] = o[15] = 1;\n  return o;\n}\n\nexport function perspective(fovy, aspect, near, far, o = new Float32Array(16)) {\n  const f = 1 / Math.tan(fovy / 2);\n  o.fill(0);\n  o[0] = f / aspect;\n  o[5] = f;\n  o[10] = (far + near) / (near - far);\n  o[11] = -1;\n  o[14] = (2 * far * near) / (near - far);\n  return o;\n}\n\nexport function ortho(l, r, b, t, n, f, o = new Float32Array(16)) {\n  o.fill(0);\n  o[0] = 2 / (r - l);\n  o[5] = 2 / (t - b);\n  o[10] = -2 / (f - n);\n  o[12] = -(r + l) / (r - l);\n  o[13] = -(t + b) / (t - b);\n  o[14] = -(f + n) / (f - n);\n  o[15] = 1;\n  return o;\n}\n\nexport function multiply(a, b, o = new Float32Array(16)) {\n  const t = o === a || o === b ? new Float32Array(16) : o;\n  for (let c = 0; c < 4; c++) {\n    for (let r = 0; r < 4; r++) {\n      t[c * 4 + r] =\n        a[r] * b[c * 4] +\n        a[4 + r] * b[c * 4 + 1] +\n        a[8 + r] * b[c * 4 + 2] +\n        a[12 + r] * b[c * 4 + 3];\n    }\n  }\n  if (t !== o) o.set(t);\n  return o;\n}\n\nexport function translate(m, x, y, z, o = new Float32Array(16)) {\n  o.set(m);\n  o[12] = m[0] * x + m[4] * y + m[8] * z + m[12];\n  o[13] = m[1] * x + m[5] * y + m[9] * z + m[13];\n  o[14] = m[2] * x + m[6] * y + m[10] * z + m[14];\n  o[15] = m[3] * x + m[7] * y + m[11] * z + m[15];\n  return o;\n}\n\nexport function fromTranslation(x, y, z, o = new Float32Array(16)) {\n  identity(o);\n  o[12] = x; o[13] = y; o[14] = z;\n  return o;\n}\n\nexport function scale(m, x, y, z, o = new Float32Array(16)) {\n  o.set(m);\n  for (let i = 0; i < 4; i++) {\n    o[i] *= x;\n    o[4 + i] *= y;\n    o[8 + i] *= z;\n  }\n  return o;\n}\n\nexport function rotateX(m, a, o = new Float32Array(16)) {\n  const s = Math.sin(a), c = Math.cos(a);\n  const r = identity(new Float32Array(16));\n  r[5] = c; r[6] = s; r[9] = -s; r[10] = c;\n  return multiply(m, r, o);\n}\n\nexport function rotateY(m, a, o = new Float32Array(16)) {\n  const s = Math.sin(a), c = Math.cos(a);\n  const r = identity(new Float32Array(16));\n  r[0] = c; r[2] = -s; r[8] = s; r[10] = c;\n  return multiply(m, r, o);\n}\n\nexport function rotateZ(m, a, o = new Float32Array(16)) {\n  const s = Math.sin(a), c = Math.cos(a);\n  const r = identity(new Float32Array(16));\n  r[0] = c; r[1] = s; r[4] = -s; r[5] = c;\n  return multiply(m, r, o);\n}\n\n/** 由偏航/俯仰构造视图矩阵（相机位于 eye） */\nexport function lookRotation(eye, yaw, pitch, o = new Float32Array(16)) {\n  const cp = Math.cos(pitch), sp = Math.sin(pitch);\n  const cy = Math.cos(yaw), sy = Math.sin(yaw);\n  // 前向量\n  const fx = -sy * cp, fy = sp, fz = -cy * cp;\n  // 右向量 = normalize(cross(f, worldUp))\n  const rx = cy, ry = 0, rz = -sy;\n  // 上向量 = cross(r, f)\n  const ux = ry * fz - rz * fy;\n  const uy = rz * fx - rx * fz;\n  const uz = rx * fy - ry * fx;\n  o[0] = rx; o[4] = ry; o[8] = rz; o[12] = -(rx * eye[0] + ry * eye[1] + rz * eye[2]);\n  o[1] = ux; o[5] = uy; o[9] = uz; o[13] = -(ux * eye[0] + uy * eye[1] + uz * eye[2]);\n  o[2] = -fx; o[6] = -fy; o[10] = -fz; o[14] = fx * eye[0] + fy * eye[1] + fz * eye[2];\n  o[3] = 0; o[7] = 0; o[11] = 0; o[15] = 1;\n  return o;\n}\n\nexport function invert(m, o = new Float32Array(16)) {\n  const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3];\n  const a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];\n  const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11];\n  const a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];\n  const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10;\n  const b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;\n  const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;\n  const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;\n  const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31;\n  const b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;\n  let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;\n  if (!det) return identity(o);\n  det = 1 / det;\n  o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;\n  o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;\n  o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;\n  o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;\n  o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;\n  o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;\n  o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;\n  o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;\n  o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;\n  o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;\n  o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;\n  o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;\n  o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;\n  o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;\n  o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;\n  o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;\n  return o;\n}\n\n/** 从投影×视图矩阵提取 6 个视锥平面（用于剔除） */\nexport function frustumPlanes(m, out = []) {\n  const p = [];\n  for (let i = 0; i < 6; i++) p.push(out[i] || new Float32Array(4));\n  const rows = (r) => [m[r], m[4 + r], m[8 + r], m[12 + r]];\n  const r0 = rows(0), r1 = rows(1), r2 = rows(2), r3 = rows(3);\n  const set = (dst, a, b, sign) => {\n    for (let i = 0; i < 4; i++) dst[i] = a[i] + sign * b[i];\n    const len = Math.hypot(dst[0], dst[1], dst[2]) || 1;\n    for (let i = 0; i < 4; i++) dst[i] /= len;\n  };\n  set(p[0], r3, r0, 1);\n  set(p[1], r3, r0, -1);\n  set(p[2], r3, r1, 1);\n  set(p[3], r3, r1, -1);\n  set(p[4], r3, r2, 1);\n  set(p[5], r3, r2, -1);\n  return p;\n}\n\nexport function aabbInFrustum(planes, minX, minY, minZ, maxX, maxY, maxZ) {\n  for (const pl of planes) {\n    const px = pl[0] > 0 ? maxX : minX;\n    const py = pl[1] > 0 ? maxY : minY;\n    const pz = pl[2] > 0 ? maxZ : minZ;\n    if (pl[0] * px + pl[1] * py + pl[2] * pz + pl[3] < 0) return false;\n  }\n  return true;\n}\n","src/util/noise.js":"// 噪声库：确定性随机、Perlin/Simplex、FBM、脊状噪声、Voronoi 元胞噪声\n// 全部为纯函数式实现，供世界生成与程序化材质共用。\n\n/** 32 位整数哈希（用于确定性随机） */\nexport function hashInt(x) {\n  x |= 0;\n  x = (x ^ 61) ^ (x >>> 16);\n  x = (x + (x << 3)) | 0;\n  x = x ^ (x >>> 4);\n  x = Math.imul(x, 0x27d4eb2d);\n  x = x ^ (x >>> 15);\n  return x >>> 0;\n}\n\n/** 由若干整数生成 [0,1) 随机数（确定性，与调用顺序无关） */\nexport function hash01(...args) {\n  let h = 0x9e3779b9;\n  for (let i = 0; i < args.length; i++) {\n    h = hashInt(h ^ Math.imul(args[i] | 0, 0x85ebca6b));\n  }\n  return (h >>> 8) / 16777216;\n}\n\n/** 可复现的伪随机数发生器（mulberry32） */\nexport class Rand {\n  constructor(seed = 1) {\n    this.s = (seed | 0) || 1;\n  }\n  next() {\n    this.s = (this.s + 0x6d2b79f5) | 0;\n    let t = this.s;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  }\n  range(a, b) {\n    return a + this.next() * (b - a);\n  }\n  int(n) {\n    return Math.floor(this.next() * n);\n  }\n  pick(arr) {\n    return arr[this.int(arr.length)];\n  }\n  chance(p) {\n    return this.next() < p;\n  }\n}\n\nconst fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);\nconst lerp = (a, b, t) => a + (b - a) * t;\n\n/** 经典 Perlin 噪声（2D/3D），带 FBM 与脊状变体 */\nexport class Perlin {\n  constructor(seed = 0) {\n    const rand = new Rand(seed ^ 0x1b873593);\n    const p = new Uint8Array(256);\n    for (let i = 0; i < 256; i++) p[i] = i;\n    for (let i = 255; i > 0; i--) {\n      const j = rand.int(i + 1);\n      const t = p[i];\n      p[i] = p[j];\n      p[j] = t;\n    }\n    this.perm = new Uint8Array(512);\n    this.permMod12 = new Uint8Array(512);\n    for (let i = 0; i < 512; i++) {\n      this.perm[i] = p[i & 255];\n      this.permMod12[i] = this.perm[i] % 12;\n    }\n  }\n\n  grad2(hash, x, y) {\n    switch (hash & 7) {\n      case 0: return x + y;\n      case 1: return x - y;\n      case 2: return -x + y;\n      case 3: return -x - y;\n      case 4: return x;\n      case 5: return -x;\n      case 6: return y;\n      default: return -y;\n    }\n  }\n\n  grad3(hash, x, y, z) {\n    switch (hash & 15) {\n      case 0: return x + y;\n      case 1: return -x + y;\n      case 2: return x - y;\n      case 3: return -x - y;\n      case 4: return x + z;\n      case 5: return -x + z;\n      case 6: return x - z;\n      case 7: return -x - z;\n      case 8: return y + z;\n      case 9: return -y + z;\n      case 10: return y - z;\n      case 11: return -y - z;\n      case 12: return x + y;\n      case 13: return -y + z;\n      case 14: return -x + y;\n      default: return -y - z;\n    }\n  }\n\n  /** 返回值域约 [-1,1] */\n  noise2(x, y) {\n    const X = Math.floor(x) & 255;\n    const Y = Math.floor(y) & 255;\n    const xf = x - Math.floor(x);\n    const yf = y - Math.floor(y);\n    const u = fade(xf);\n    const v = fade(yf);\n    const p = this.perm;\n    const aa = p[p[X] + Y];\n    const ab = p[p[X] + Y + 1];\n    const ba = p[p[X + 1] + Y];\n    const bb = p[p[X + 1] + Y + 1];\n    const x1 = lerp(this.grad2(aa, xf, yf), this.grad2(ba, xf - 1, yf), u);\n    const x2 = lerp(this.grad2(ab, xf, yf - 1), this.grad2(bb, xf - 1, yf - 1), u);\n    return lerp(x1, x2, v) * 0.72;\n  }\n\n  noise3(x, y, z) {\n    const X = Math.floor(x) & 255;\n    const Y = Math.floor(y) & 255;\n    const Z = Math.floor(z) & 255;\n    const xf = x - Math.floor(x);\n    const yf = y - Math.floor(y);\n    const zf = z - Math.floor(z);\n    const u = fade(xf);\n    const v = fade(yf);\n    const w = fade(zf);\n    const p = this.perm;\n    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;\n    const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;\n    const x1 = lerp(this.grad3(p[AA], xf, yf, zf), this.grad3(p[BA], xf - 1, yf, zf), u);\n    const x2 = lerp(this.grad3(p[AB], xf, yf - 1, zf), this.grad3(p[BB], xf - 1, yf - 1, zf), u);\n    const y1 = lerp(x1, x2, v);\n    const x3 = lerp(this.grad3(p[AA + 1], xf, yf, zf - 1), this.grad3(p[BA + 1], xf - 1, yf, zf - 1), u);\n    const x4 = lerp(this.grad3(p[AB + 1], xf, yf - 1, zf - 1), this.grad3(p[BB + 1], xf - 1, yf - 1, zf - 1), u);\n    const y2 = lerp(x3, x4, v);\n    return lerp(y1, y2, w) * 0.86;\n  }\n\n  fbm2(x, y, octaves = 4, lacunarity = 2, gain = 0.5) {\n    let amp = 1, freq = 1, sum = 0, norm = 0;\n    for (let i = 0; i < octaves; i++) {\n      sum += amp * this.noise2(x * freq, y * freq);\n      norm += amp;\n      amp *= gain;\n      freq *= lacunarity;\n    }\n    return sum / norm;\n  }\n\n  fbm3(x, y, z, octaves = 4, lacunarity = 2, gain = 0.5) {\n    let amp = 1, freq = 1, sum = 0, norm = 0;\n    for (let i = 0; i < octaves; i++) {\n      sum += amp * this.noise3(x * freq, y * freq, z * freq);\n      norm += amp;\n      amp *= gain;\n      freq *= lacunarity;\n    }\n    return sum / norm;\n  }\n\n  /** 脊状噪声：适合生成山脊 */\n  ridged2(x, y, octaves = 4, lacunarity = 2, gain = 0.5) {\n    let amp = 1, freq = 1, sum = 0, norm = 0;\n    for (let i = 0; i < octaves; i++) {\n      const n = 1 - Math.abs(this.noise2(x * freq, y * freq));\n      sum += amp * n * n;\n      norm += amp;\n      amp *= gain;\n      freq *= lacunarity;\n    }\n    return (sum / norm) * 2 - 1;\n  }\n\n  /** 可平铺的 2D FBM（材质用，保证纹理左右上下无缝） */\n  tileFbm2(x, y, period, octaves = 4, gain = 0.5) {\n    let amp = 1, freq = 1, sum = 0, norm = 0;\n    for (let i = 0; i < octaves; i++) {\n      sum += amp * this.tileNoise2(x * freq, y * freq, period * freq);\n      norm += amp;\n      amp *= gain;\n      freq *
